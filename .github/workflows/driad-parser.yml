name: DRIAD parser

# The DRIAD parser consumes unauthenticated DNS responses: plain UDP:53 on the
# native path, DoH bytes handed to WASM on the browser path. This lane gates the
# golden wire corpus, the bounded mutation harness, and the libFuzzer targets
# that cover the hand-rolled bounds handling in the message walker (BLO-28790).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to test
        required: false

permissions:
  contents: read

concurrency:
  group: driad-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: golden corpus + mutation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept equal to rust-toolchain.toml's `channel`, which would silently
      # outrank a floating `@stable` here anyway (BLO-41503).
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2

      # Covers the whole crate, including the 25 in-module driad.rs unit tests.
      - name: cargo test (lib)
        run: cargo test --lib --no-default-features --locked

      # Golden wire vectors: IPv4/IPv6/name relays, compression, multi-answer
      # precedence, transaction IDs, questions, answer ownership and class.
      # `fixtures_on_disk_match_generator` fails if a checked-in fixture has
      # drifted from the generator that documents its intent.
      - name: golden DRIAD corpus
        run: cargo test --test driad_golden --no-default-features --locked

      # Deterministic bounded mutation over the same corpus. Runs on stable so
      # totality is gated on every PR, not only when the nightly fuzz job runs.
      - name: bounded mutation harness
        run: cargo test --test driad_fuzz_corpus --no-default-features --features fuzzing --locked

      # Candidate lists: precedence, D-bit and TTL kept per record, tie
      # permutations reachable, type-3 expansion, query binding, EDNS framing.
      - name: candidate lists
        run: cargo test --test driad_candidates --no-default-features --locked

  wasm-shape:
    name: wasm-bindgen JS shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept equal to rust-toolchain.toml's `channel` (BLO-41503).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The runner must speak the crate's bindgen schema, so its version comes
      # from Cargo.lock instead of a second pin that could drift.
      - name: install wasm-bindgen-test-runner
        run: |
          set -euo pipefail
          version="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      # JsDriad.parseDnsResponseCandidates(Validated) / parseDnsAddressesValidated
      # return arrays of plain objects; only a wasm32 build in a JS host can
      # observe that shape. Fails if the two shape tests did not both run.
      - name: JsDriad candidate and address shape (Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          set -euo pipefail
          cargo test --target wasm32-unknown-unknown --lib js_shape --locked 2>&1 | tee shape.log
          grep -q 'test result: ok. 2 passed' shape.log

  fuzz:
    name: libFuzzer (bounded)
    runs-on: ubuntu-latest
    # `cargo fuzz` needs nightly, and `dtolnay/rust-toolchain@nightly` below only
    # gets it there via `rustup default nightly`. rust-toolchain.toml (BLO-41503)
    # outranks `rustup default`, so without this every cargo call in this job
    # would silently run on the pinned stable and cargo-fuzz would fail.
    # RUSTUP_TOOLCHAIN in turn outranks rust-toolchain.toml — measured, not
    # assumed: with a toml present `rustup which cargo` tried to sync the toml's
    # channel, and `RUSTUP_TOOLCHAIN=stable rustup which cargo` did not.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Bounded so this is a regression gate, not an open-ended fuzzing session:
      # each target runs the checked-in seed corpus plus a fixed time budget.
      # A crash writes to fuzz/artifacts/ and fails the job.
      - name: fuzz parse_dns_response
        run: cargo fuzz run driad_parse_response -- -max_total_time=120 -max_len=4096
      - name: fuzz parse_amtrelay_rdata
        run: cargo fuzz run driad_amtrelay_rdata -- -max_total_time=120 -max_len=512
      - name: fuzz validated/unvalidated differential
        run: cargo fuzz run driad_query_roundtrip -- -max_total_time=120 -max_len=4096
      - name: fuzz candidate list
        run: cargo fuzz run driad_candidates -- -max_total_time=120 -max_len=4096

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
