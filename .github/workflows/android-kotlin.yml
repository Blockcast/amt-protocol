name: Android Kotlin

# Builds and unit-tests the Kotlin library module in android/ (README there):
# `gradle -p android test` for the pure-Kotlin parts and `assembleRelease` for
# the AAR. No .so is needed for either; android-jni.yml builds those.

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-kotlin.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: android kotlin (gradle test + aar)
    # Fork PRs skipped for the same reason as android-jni.yml: PR-controlled
    # code on the trusted in-cluster ARC pool.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: default-tools
      labels: arc-light
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list includes `tools`, which sdkmanager no
      # longer serves, so the step fails unless `packages` is set. Platform 36
      # is compileSdk in android/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      # No wrapper is committed (android/README.md); pin the Gradle the module
      # was verified with.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: gradle test
        run: gradle -p android --no-daemon testDebugUnitTest

      # Anti-vacuity: a test task that found no classes still passes.
      - name: unit test results present
        run: |
          set -euo pipefail
          ls android/build/test-results/testDebugUnitTest/TEST-*.xml
          ! grep -l '<failure' android/build/test-results/testDebugUnitTest/TEST-*.xml

      - name: gradle assembleRelease
        run: gradle -p android --no-daemon assembleRelease

      - name: AAR present
        run: ls -l android/build/outputs/aar/*-release.aar
