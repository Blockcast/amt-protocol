name: AMT public-vantage probe

# BLO-21823. Runs the real amt-verify from a GitHub-HOSTED runner (public egress,
# arbitrary outbound UDP). Deliberately NOT a self-hosted ARC runner: those are
# in-cluster, so the relay sees an RFC1918 source and its reply is unroutable.
# That vantage artifact is what five weeks of in-cluster probes actually measured.

on:
  workflow_dispatch:
    inputs:
      relay:
        description: Relay IPv4
        default: "69.25.95.128"
      source:
        description: SSM source
        default: "69.25.95.192"
      group:
        description: Multicast group
        default: "232.1.1.60"
      timeout:
        description: >-
          OVERALL deadline in seconds for the whole data phase (NOT first-data,
          NOT per-packet). On expiry amt-verify still writes report.json with
          outcome=timeout and the partial packet_count/byte_count, and exits 1.
          A third outcome, `closed`, means the data broadcast ended rather than
          the deadline expiring — partial counts are still real, but it is a
          transport failure, not a deadline observation, so do not read a rate
          off it.
        default: "30"
      packet_count:
        description: Packets to receive before reporting ok
        default: "3"
      tunnels:
        description: >-
          BLO-26574 step 1: number of CONCURRENT data-receiving tunnels to run
          from this one runner, to find the HARNESS ceiling. Each is a separate
          amt-verify process (one tunnel per process) sharing the runner netns
          via --network host, so fds and NAT source ports are host-scoped —
          which is what makes the ceiling measurable at all. Ramp this until
          one of the four candidate binders gives (process/container count,
          `ulimit -n`, NAT source-port exhaustion, 4-vCPU decap) and name which.
          NOT the same knob as `amt-verify --tunnels N`, which holds N IDLE
          gateways to measure control-plane tunnel-table occupancy and is
          documented as NOT receiving data. That arm is BLO-33457.
        default: "1"
  push:
    branches: [blo-21823-public-amt-probe]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RELAY: ${{ inputs.relay || '69.25.95.128' }}
      SOURCE: ${{ inputs.source || '69.25.95.192' }}
      GROUP: ${{ inputs.group || '232.1.1.60' }}
      TIMEOUT: ${{ inputs.timeout || '30' }}
      PACKETS: ${{ inputs.packet_count || '3' }}
      TUNNELS: ${{ inputs.tunnels || '1' }}
    steps:
      - name: Vantage receipt
        run: |
          echo "utc=$(date -u +%FT%TZ)"
          echo "public_ip=$(curl -fsS https://api.ipify.org)"
          echo "target=$RELAY:2268 sg=($SOURCE,$GROUP)"
          # BLO-33455. The fan-out ramp's stop rule is RECEIVER headroom: the
          # relay fans one stream into N unicast tunnels and this NIC absorbs
          # N x per-tunnel bitrate. At 1 GbE the knee is the runner; at 10 GbE
          # it is plausibly the relay. Same ramp, opposite attributions -- so
          # the line rate travels with every receipt rather than being re-derived.
          # Virtualised NICs report -1 or nothing: that is `unknown`, never a
          # spec-sheet guess. `unknown` means fall back to an empirical ceiling.
          dev=$(ip -j route get 1.1.1.1 2>/dev/null | jq -r '.[0].dev // empty' || true)
          speed=$(cat "/sys/class/net/$dev/speed" 2>/dev/null || true)
          case "$speed" in ''|*[!0-9]*|0) speed=unknown ;; esac
          # A paravirtual NIC (hv_netvsc, virtio_net) reports the SYNTHETIC link
          # speed, not provisioned bandwidth, so a well-formed number there is
          # not a line rate -- the same spec-sheet substitution the `unknown`
          # branch exists to prevent, just sourced from the kernel. Allowlist
          # PHYSICAL drivers rather than denylisting virtual ones: the miss
          # directions are asymmetric. A denylist miss (ena, gve, a veth inside
          # a container) ships a synthetic integer as authoritative; an
          # allowlist miss emits `unknown` on a real NIC, which falls back to
          # the empirical ceiling -- what the consumer does anyway.
          drv=$(ethtool -i "$dev" 2>/dev/null | awk '/^driver:/{print $2}' || true)
          reported=$speed
          case "${drv:-}" in
            ixgbe|i40e|ice|igb|igc|e1000e|tg3|bnxt_en|mlx4_en|mlx5_core|atlantic) ;;
            *) speed=unknown ;;
          esac
          # `nic_speed_mbps_reported` keeps the raw reading: it is what caught
          # the synthetic value (50000 vs 100000 across two runs 2m23s apart)
          # and it distinguishes "sysfs said nothing" from "sysfs said something
          # synthetic". `nic_speed_mbps` is the only authoritative field.
          echo "egress_dev=${dev:-unknown} nic_speed_mbps=$speed nic_driver=${drv:-unknown} nic_speed_mbps_reported=${reported}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: amt-verify (real client, public vantage)
        run: |
          docker pull -q ghcr.io/blockcast/amt-verify:main
          echo "image_digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/blockcast/amt-verify:main)"
          # BLO-21823 AC#3 wants the client commit alongside the artifact hash.
          echo "client_commit=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' ghcr.io/blockcast/amt-verify:main)"
          set +e
          # BLO-33456. `mmtp.gaps` says packets went missing; it does NOT say
          # where. The kernel already counts the one candidate that is cheapest
          # to rule in or out, so read it rather than dispatching a study:
          # `Udp: RcvbufErrors` is datagrams dropped because the socket receive
          # buffer was full -- i.e. this receiver fell behind, not the path.
          # `--network host` puts the container in THIS netns, so the runner's
          # /proc/net/snmp is the container's counter.
          #
          # Three-way partition of a gap, none of which needs a source counter:
          #   lagged_count > 0  -> userspace consumer behind (broadcast channel)
          #   RcvbufErrors > 0  -> kernel socket buffer overran (reader behind)
          #   both 0, gaps > 0  -> loss upstream of this host
          # The known-clean sessions (gaps: 0) are the built-in negative control:
          # attribution is by COVARIATION across lossy/clean, not by a threshold.
          #
          # Caveat, and it is real: this counter is netns-WIDE, not per-socket.
          # On an otherwise-idle hosted runner ours is the only meaningful UDP
          # traffic, but a non-zero delta is evidence about the netns, so do not
          # read a small one as proof it was us.
          #
          # That partition localises a gap to THIS HOST or not. It cannot place
          # an upstream gap on the shared leg vs. on this receiver's own leg
          # downstream of the relay's per-tunnel fan-out -- and `gaps` /
          # `gap_events` cannot either: BLO-33456 pair E had two receivers on
          # different /8s report 501 / 34 identically, which fits both "they
          # share the lossy leg" and "the source emitted a discontinuous
          # sequence, so nothing was lost". `mmtp.gap_positions` settles it.
          # Run two CONCURRENT probes (check overlap via data_started_at_ms /
          # data_ended_at_ms, NOT dispatch time), then over the two receipts:
          #
          # Compare ABSENT SEQUENCE NUMBERS, never the {pid,after,missing}
          # objects. A burst straddling the two receivers differently yields
          # the SAME absent range described by different triples -- e.g.
          # {1,6435823,50} vs {1,6435824,49}, both ending at 6435873 -- so an
          # object-equality compare scores them as disjoint on BOTH sides and
          # invents per-receiver loss that is not there. Measured 2026-09-14 on
          # runs 34810353292 / 34810354915: object-compare reports 4 a_only +
          # 4 b_only events carrying 550 packets; the true divergence is
          # 2 packets. A 275x overstatement, in the direction that manufactures
          # a per-receiver verdict.
          #
          #   jq -n --slurpfile a a/report.json --slurpfile b b/report.json '
          #     def absent: [.mmtp.gap_positions[] as $g
          #                  | range($g.after+1; $g.after+$g.missing+1)
          #                  | "\($g.pid):\(.)"] | sort;
          #     ($a[0]|absent) as $A | ($b[0]|absent) as $B |
          #     {a:($A|length), b:($B|length),
          #      shared:(($A-($A-$B))|length),
          #      a_only:(($A-$B)|length), b_only:(($B-$A)|length)}'
          #
          #   shared >> a_only+b_only -> stream-as-delivered (shared leg, or
          #                              source-side sequence discontinuity)
          #   mostly disjoint         -> per-receiver loss below the fan-out
          #
          # Both arms behind ONE relay cannot separate source-side discontinuity
          # from loss in that relay's own ingest: both are "upstream of fan-out".
          # Electing between them needs two receivers behind DIFFERENT relays.
          #
          # Truncation is visible as gap_positions|length < gap_events; a
          # truncated list makes `shared` a lower bound, not a verdict.
          udp_counters() { awk '/^Udp:/{n++; if (n==2) print}' /proc/net/snmp; }
          udp_before=$(udp_counters)
          t0=$(date +%s%3N)
          # BLO-26574 step 1 (harness ceiling). One tunnel per PROCESS, all in
          # the runner netns. At TUNNELS=1 this is byte-identical in behaviour
          # to the single `docker run` it replaces, including the exit code.
          pids=""
          for i in $(seq 1 "$TUNNELS"); do
            docker run --rm --network host ghcr.io/blockcast/amt-verify:main \
              --no-driad --relay "$RELAY" --source "$SOURCE" --group "$GROUP" \
              --timeout "$TIMEOUT" --packet-count "$PACKETS" --json --verbose \
              >"report-$i.json" 2>"verbose-$i.log" &
            pids="$pids $!"
          done
          # Record what the RIG could even launch, before asking what the relay
          # did. A launch that fails on fds or source ports is the harness
          # ceiling and must not be read as a relay result.
          echo "tunnels_requested=$TUNNELS"
          echo "ulimit_n_soft=$(ulimit -Sn) ulimit_n_hard=$(ulimit -Hn)"
          echo "nproc=$(nproc)"
          # BLO-26574 Amendment 12g, Finding 1. The relay keys tunnel state on
          # the outer source ADDRESS only -- `amt_request_handler` compares
          # `tunnel->addr.ip4 == iph->saddr` with no port term (amt.c:3692),
          # `amt_update_handler` matches the same way (amt.c:3330), and on a
          # match `send:` OVERWRITES tunnel->source_port and tunnel->nonce
          # (amt.c:3759-3766). So a later Request from the same address steals
          # the one tunnel, and the earlier gateway's Membership Updates are
          # then dropped as `Invalid MAC` (amt.c:3333-3341). N processes in one
          # `--network host` netns therefore produce ONE tunnel, not N.
          # k is how many distinct source addresses this rig can present;
          # N_established can never exceed it. Recorded so that a clean-looking
          # receipt cannot be read as fan-out it never generated.
          echo "distinct_source_ips=1"
          if [ "$TUNNELS" -gt 1 ]; then
            echo "fanout_capable=no (k=1 < TUNNELS=$TUNNELS; void as a relay result)"
          else
            echo "fanout_capable=yes (k=1 >= TUNNELS=$TUNNELS)"
          fi
          i=0; ok=0
          for p in $pids; do
            i=$((i+1))
            wait "$p"; s=$?
            # BLO-26574 (CTO ruling item 5). amt-verify exits 1 on
            # `outcome: timeout`, which is the NORMAL end of a bounded sample --
            # so the exit code alone cannot separate a healthy 90s probe from a
            # tunnel that received nothing. packet_count is the verdict: >0 is a
            # successful sample whatever the outcome, ==0 is a failure. Fails
            # closed -- a missing, empty or unparseable receipt lands on 0.
            pc=$(jq -r '.packet_count // 0' "report-$i.json" 2>/dev/null || echo 0)
            case "$pc" in ''|*[!0-9]*) pc=0 ;; esac
            [ "$pc" -gt 0 ] && ok=$((ok+1))
            echo "tunnel_exit[$i]=$s packet_count[$i]=$pc"
          done
          t1=$(date +%s%3N)
          udp_after=$(udp_counters)
          set -e
          # Delta, labelled off the header line so a kernel that adds a field
          # cannot silently shift `RcvbufErrors` onto a neighbour's value.
          #
          # Guard on ABSENCE, not on value. If any of the three lines is short or
          # empty -- /proc/net/snmp unreadable, `Udp:` block absent or renamed --
          # the unguarded form prints a complete, well-formed, entirely fake
          # `udp_delta ... RcvbufErrors=0`, because `A[i]-B[i]` on unset fields is
          # 0-0. A consumer thresholding on `RcvbufErrors=0` cannot tell that from
          # a real zero. So: require all three field counts to agree, else emit
          # `udp_delta_invalid` and NO `udp_delta` line at all -- a grep for
          # `RcvbufErrors=` then finds nothing, which is the honest answer.
          #
          # Deliberately does NOT exit non-zero: `set -e` is in force further down
          # and a failed step discards report.json, re-introducing the AC1 defect
          # this issue exists to fix. Fail closed on the counter, not on the run.
          #
          # This is about CAPTURE validity only. It does nothing for FIELD
          # responsiveness: `RcvbufErrors` has never been driven non-zero on this
          # runner, so a dead-dial reading of that specific counter is still not
          # excluded. That needs a deliberately-starved receiver, not a width check.
          awk -v hdr="$(awk '/^Udp:/{print; exit}' /proc/net/snmp)" \
              -v b="$udp_before" -v a="$udp_after" '
            BEGIN {
              nh = split(hdr, H); nb = split(b, B); na = split(a, A)
              if (nh < 2 || nh != nb || nh != na) {
                printf "udp_delta_invalid hdr=%d before=%d after=%d\n", nh, nb, na
                exit 0
              }
              out = ""
              for (i = 2; i <= nh; i++) out = out sprintf(" %s=%d", H[i], A[i] - B[i])
              printf "udp_delta%s\n", out
            }'
          echo "tunnels_receiving=$ok/$TUNNELS"
          # BLO-27413: receiver-side saturation witness. The relay fans one
          # multicast stream into N unicast tunnels, so the receiving vantage
          # absorbs N x stream_bitrate. Without a per-tunnel bitrate there is no
          # way to tell a relay knee from the receiver's own ceiling -- which is
          # the same class of error as the five weeks that measured probe vantage.
          #
          # BLO-33456: prefer report.json's `elapsed_ms` over this shell-measured
          # one. This `t1-t0` includes `docker run` container startup (~459ms,
          # solved for over two runs) and so overstates elapsed / understates
          # rate on short samples; the in-process one starts once subscribe()
          # has completed, so it excludes the handshake too.
          # Kept only as an outer bound and a cross-check on that constant.
          echo "wallclock_elapsed_ms=$((t1-t0))"
          for i in $(seq 1 "$TUNNELS"); do
            echo "--- report-$i.json ---"; cat "report-$i.json" || true
          done
          # verbose.log is per-tunnel and large; dump it only for the 1-tunnel
          # case, where it is the handshake trace someone actually reads.
          # `if`, not `[ ] && { }` — the latter returns 1 when TUNNELS != 1 and
          # GitHub runs this under `bash -e`, so it would abort every ramp step.
          if [ "$TUNNELS" = 1 ]; then echo '--- verbose-1.log ---'; cat verbose-1.log || true; fi
          # Ally review (head ada02515): TUNNELS=1 must stay artifact-compatible
          # with the single `docker run` this step replaced -- downstream
          # consumers fetch `report.json` and `verbose.log` BY NAME, and the
          # indexed rename would have made them silently miss the receipt.
          # Keep the indexed files as the uniform internal contract and add the
          # legacy names as aliases for the one-tunnel case, so both shapes
          # resolve. Globs below are `report*` / `verbose*` (no dash) to cover
          # the aliases as well as the indexed files.
          if [ "$TUNNELS" = 1 ]; then cp report-1.json report.json; cp verbose-1.log verbose.log; fi
          sha256sum report*.json verbose*.log
          # BLO-26574: the (S,G) GUARD. The dispatch defaults are cast
          # (69.25.95.192, 232.1.1.60); a caller who omits inputs silently
          # measures a different stream than intended, and until now the `sg=`
          # echo was the only tell. That cost a retracted 2.75x-low per-tunnel
          # figure. report.json carries the tuple the client actually joined, so
          # assert it rather than printing it: a receipt that disagrees with the
          # caller's intent fails the job.
          for i in $(seq 1 "$TUNNELS"); do
            got_s=$(jq -r '.source // "null"' "report-$i.json")
            got_g=$(jq -r '.group  // "null"' "report-$i.json")
            if [ "$got_s" != "$SOURCE" ] || [ "$got_g" != "$GROUP" ]; then
              echo "::error::receipt $i joined ($got_s,$got_g), caller asked for ($SOURCE,$GROUP)"
              exit 90
            fi
          done
          echo "sg_guard=ok ($SOURCE,$GROUP) on $TUNNELS receipt(s)"
          # A probe that cannot fail is not a probe: surface the client's verdict
          # as the job's verdict. Receipts still upload via `if: always()`.
          #
          # Ally review (head ada02515): this used to `exit "$status"`, which
          # carried TUNNEL 1's exit code -- so a healthy first tunnel made the
          # whole N-tunnel step green even when every later tunnel failed, and
          # `tunnels_exit_zero` was printed but never consulted. The verdict is
          # now the aggregate over packet_count, not tunnel 1's exit status.
          #
          # Deliberate divergence from that review, flagged rather than taken
          # quietly: it asked to "keep the single-tunnel exit code unchanged",
          # but the CTO ruling (item 5) is that the single-tunnel code is itself
          # the defect -- `outcome: timeout` with packet_count > 0 is a
          # SUCCESSFUL bounded sample and must exit 0. Both cases are therefore
          # decided by packet_count. Consumers should still parse packet_count
          # rather than the run conclusion.
          if [ "$ok" -ne "$TUNNELS" ]; then
            echo "::error::$((TUNNELS - ok)) of $TUNNELS tunnel(s) received no data (packet_count=0)"
            exit 1
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-verify-receipt
          path: |
            report*.json
            verbose*.log
