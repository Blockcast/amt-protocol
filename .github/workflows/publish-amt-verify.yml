name: Publish amt-verify image

on:
  push:
    branches: [main, blo-15657-amt-verify-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockcast/amt-verify:${{ github.sha }}
            ghcr.io/blockcast/amt-verify:main
          labels: |
            org.opencontainers.image.source=https://github.com/Blockcast/amt-protocol
            org.opencontainers.image.revision=${{ github.sha }}
