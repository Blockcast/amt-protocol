name: AMT public-vantage probe

# BLO-21823. Runs the real amt-verify from a GitHub-HOSTED runner (public egress,
# arbitrary outbound UDP). Deliberately NOT a self-hosted ARC runner: those are
# in-cluster, so the relay sees an RFC1918 source and its reply is unroutable.
# That vantage artifact is what five weeks of in-cluster probes actually measured.

on:
  workflow_dispatch:
    inputs:
      relay:
        description: Relay IPv4
        default: "69.25.95.128"
      source:
        description: SSM source
        default: "69.25.95.192"
      group:
        description: Multicast group
        default: "232.1.1.60"
      timeout:
        description: >-
          OVERALL deadline in seconds for the whole data phase (NOT first-data,
          NOT per-packet). On expiry amt-verify still writes report.json with
          outcome=timeout and the partial packet_count/byte_count, and exits 1.
          A third outcome, `closed`, means the data broadcast ended rather than
          the deadline expiring — partial counts are still real, but it is a
          transport failure, not a deadline observation, so do not read a rate
          off it.
        default: "30"
      packet_count:
        description: Packets to receive before reporting ok
        default: "3"
      mode:
        description: >-
          oneshot = the BLO-21823 data-receipt probe (default, unchanged).
          tunnels-ramp = the BLO-33457 tunnel-STATE occupancy ramp.
          loss-delta = the BLO-33636 AC-2 fan-out loss control: legs N=1, N, N=1
          launched CONCURRENTLY on three DIFFERENT vantages, scored as a
          DIFFERENCE against the paired noise floor the two N=1 legs give.
          It answers "does asking for N tunnels cost loss?", which is what the
          AC's retired absolute threshold was reaching for; it does NOT re-decide
          demultiplexing -- that verdict is oneshot's (exit 91 VOID / 93 knee).
        type: choice
        options: [oneshot, tunnels-ramp, loss-delta]
        default: oneshot
      ramp_steps:
        description: >-
          tunnels-ramp only. Comma-separated N values, ascending. The cap is
          AMT_MAX_TUNNELS=10000 on production-amt-relay-linux (read live from
          amt_relay_tunnel_limit, 2026-09-12), but the DEFAULT stops at 1024:
          4096/8192/10000 are withheld pending a working relay-side occupancy
          instrument (CTO ruling 2026-09-12). 1024 against a 10000 cap cannot
          displace a live subscriber even if the table is occupied, which is why
          it is safe without one; the larger steps rested on "the table is
          empty", and the only evidence for that was amt_relay_active_tunnels,
          which is the gauge the same ruling declared dead. Raise this only with
          an occupancy reading that has been shown capable of returning a
          positive.
        default: "1,8,64,256,1024"
      hold:
        description: >-
          tunnels-ramp only. Seconds to hold tunnels open after the last one is
          established, before reading the survival verdict. Must exceed
          --keepalive so every tunnel can emit >=1 keep-alive Membership Update
          (BLO-33457 AC 3); amt-verify exits 2 rather than reporting a false
          knee if it does not.
        default: "25"
      keepalive:
        description: tunnels-ramp only. Keep-alive interval in seconds.
        default: "10"
      tunnels:
        description: >-
          BLO-26574 step 1: number of CONCURRENT data-receiving tunnels to run
          from this one runner, to find the HARNESS ceiling. Each is a separate
          amt-verify process (one tunnel per process) sharing the runner netns
          via --network host, so fds and NAT source ports are host-scoped —
          which is what makes the ceiling measurable at all. Ramp this until
          one of the four candidate binders gives (process/container count,
          `ulimit -n`, NAT source-port exhaustion, 4-vCPU decap) and name which.
          NOT the same knob as `amt-verify --tunnels N`, which holds N IDLE
          gateways to measure control-plane tunnel-table occupancy and is
          documented as NOT receiving data. That arm is BLO-33457.
        default: "1"
      route_failure:
        description: >-
          BLO-33585. Normally OFF for dispatch. The scheduled detector files a
          GitHub issue when a probe receives zero data; a DISPATCHED probe must
          not, because dispatch is how measurements are taken and several of
          them fail by design (exit 91 VOID, deliberate zero-forwarding
          controls). Set true only to exercise the routing path itself -- which
          is what the AC's "positive control showing it firing" requires, and
          the reason this is an input rather than a bare
          `github.event_name == 'schedule'` test that can never be run on
          demand.
        type: boolean
        default: false
  push:
    branches: [blo-21823-public-amt-probe]
  # BLO-33585. The relay stopped forwarding for >=51 min on 2026-09-12 and NOT
  # ONE relay-side instrument witnessed it: nine series were checked and all
  # nine are dead for this purpose (amt_relay_drops_total, _gateway_overflow_total,
  # _active_tunnels, container_cpu_*, container_network_transmit_* (absent),
  # node_network_receive_*/transmit_* (relay's ~11 Mbps inside a +-80 Mbps
  # node-shared noise band, S/N ~0.27), node_network_receive_multicast_total,
  # and the relay log's `Kernel mode - Stats: RX` (control traffic, ~44 B/pkt --
  # it sat frozen while 340,953 packets were delivered). The ONLY thing that
  # saw the outage was receiver-side data receipt from this very workflow --
  # run by hand. So the missing half of the detector was never the instrument.
  # It was the cron.
  #
  # Off-the-hour on purpose: GitHub documents that scheduled workflows on the
  # hour are the most contended slots and are delayed or dropped under load,
  # which on a detector reads as "no failure" -- the one failure direction that
  # must never be silent.
  #
  # Deliberately runs with the DISPATCH DEFAULTS (timeout=30, packet_count=3,
  # tunnels=1) rather than the heavy AC2 verification parameters
  # (timeout=90, packet_count=99999999). Detection asks "is this relay
  # forwarding to a public gateway AT ALL", which 3 packets answer in about a
  # second; the 90s full-rate sample is a MEASUREMENT and belongs on dispatch.
  # Keeps a 15-minute cadence affordable in runner minutes.
  #
  # HOW TO RE-VERIFY THIS DETECTOR (all three run against production .128):
  #
  #   negative (must exit 0, detector silent when healthy):
  #     -f source=69.25.95.192 -f group=232.1.1.60 -f timeout=90 \
  #     -f packet_count=99999999
  #   positive (must exit 1 on the VERDICT, not an earlier guard):
  #     -f source=69.25.95.192 -f group=232.1.1.99 -f timeout=60 -f packet_count=3
  #   positive, full chain (must also print `routed=created`):
  #     ...as above, plus -f route_failure=true
  #   The row it files is titled with (source,group), and routing dedups on
  #   the exact title, so an open .99 control row cannot absorb .60 alerts.
  #   Close it afterwards anyway.
  #
  # 232.1.1.99 carries no source traffic, so it replays the BLO-33585 shape:
  # tunnel established, membership accepted, zero data. CHECK `sg_guard=ok` IS
  # PRESENT in the positive receipt -- without it the run may have died on the
  # (S,G) guard (exit 90) or the fan-out VOID (exit 91), which look like a
  # working detector and prove nothing.
  #
  # ⚠ DISPATCH THE CONTROLS FROM `main`, NOT FROM A PR BRANCH. A dispatched run
  # attaches a check-run to whatever SHA it ran against, so a deliberate red
  # control fired from a PR branch lands a permanent `probe: failure` row on
  # that PR's head -- and the merge-gate reader keys on (name, run id), so a
  # later green probe does NOT supersede it. That head can then never satisfy
  # "every check-run at head is success". Measured on this PR at 88739bb.
  #
  # ⚠ GitHub DISABLES a scheduled workflow on a PUBLIC repo after 60 days of
  # *repository* inactivity (this repo is public). That is a silent off-switch
  # thrown by unrelated inactivity, on a detector whose whole thesis is that
  # silence is the one unacceptable failure direction -- and nothing in this
  # file can detect it, because a workflow that never runs files nothing. If
  # this repo ever goes quiet for two months, re-enable the schedule by hand.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  packages: read

# THE IMAGE IS PINNED TO THE CHECKOUT, and that is the whole point.
#
# This was `:main` in all eight places. `:main` is whatever was last pushed to
# main, which is NOT the ref this run checked out -- so a run dispatched from a
# branch executes main's client while every string the job emits (the ramp
# contract, CONTROL_PLANE_CAVEAT, the receiver-side witness classify_held_tunnel)
# comes from the branch. The witness under test is then not the witness that
# runs, and the artifact reports the branch's caveat over main's measurement.
#
# publish-amt-verify.yml already pushes ghcr.io/blockcast/amt-verify:<sha> on
# every main build, so pinning to github.sha costs nothing and cannot go stale:
# the tag IS the commit.
#
# But that publisher only fires on main, so on a BRANCH no such tag exists and
# the pull fails -- which made this workflow undispatchable from the very PR it
# is supposed to verify (Ally, 945d069). So: pull, and on a miss BUILD from the
# checkout. Both paths yield the checkout's client, by tag identity on main and
# by construction on a branch. On the build path the revision assertion below is
# tautological -- provenance there rests on having built the checked-out tree,
# not on the label -- and the receipt says `local-build` rather than a registry
# digest, because there isn't one and an empty field would read as a missing
# measurement rather than an absent one.
env:
  IMAGE: ghcr.io/blockcast/amt-verify:${{ github.sha }}

jobs:
  probe:
    if: ${{ (inputs.mode || 'oneshot') == 'oneshot' }}
    runs-on: ubuntu-latest
    # An EXCEEDED job timeout CANCELS the job. MEASURED, not inferred -- the
    # docs do not state it, and it decides how `Route probe failure` must be
    # gated, so it was settled by experiment rather than by reading:
    #
    #   run 36207352472, `timeout-minutes: 1` against `sleep 300`
    #     job conclusion ........................ cancelled
    #     step `if: failure()` .................. SKIPPED
    #     step `if: cancelled()` ................ ran
    #     step `if: always() && job.status != 'success'` ... ran, job.status=cancelled
    #
    # Two consequences, both load-bearing below. A `failure()`-gated router
    # cannot see a wedge, which is why the gate at `Route probe failure` is
    # `always() && job.status != 'success'` and must not be reverted to
    # `failure()`. And the runner DOES execute always()/cancelled() steps after
    # a timeout, so a wedge can still file -- the router is reachable, it just
    # has to ask for a status the cancellation path actually sets.
    #
    # The bound itself is separate and is a resource fix: the default is
    # 360 min against a 15-minute cron, i.e. one wedge spans ~24 firings and
    # (at 10 < 15) runs can no longer overlap. A bounded sample here is
    # seconds; 10 min is slack, not a budget.
    timeout-minutes: 10
    # Job-scoped so `issues: write` reaches only this job and not tunnels-ramp.
    # Job-level permissions REPLACE the workflow block rather than merging, so
    # contents/packages are restated here -- dropping either breaks checkout or
    # the ghcr pull.
    permissions:
      contents: read
      packages: read
      issues: write
    env:
      RELAY: ${{ inputs.relay || '69.25.95.128' }}
      SOURCE: ${{ inputs.source || '69.25.95.192' }}
      GROUP: ${{ inputs.group || '232.1.1.60' }}
      TIMEOUT: ${{ inputs.timeout || '30' }}
      PACKETS: ${{ inputs.packet_count || '3' }}
      TUNNELS: ${{ inputs.tunnels || '1' }}
    steps:
      - name: Vantage receipt
        run: |
          echo "utc=$(date -u +%FT%TZ)"
          echo "public_ip=$(curl -fsS https://api.ipify.org)"
          echo "target=$RELAY:2268 sg=($SOURCE,$GROUP)"
          # BLO-33455. The fan-out ramp's stop rule is RECEIVER headroom: the
          # relay fans one stream into N unicast tunnels and this NIC absorbs
          # N x per-tunnel bitrate. At 1 GbE the knee is the runner; at 10 GbE
          # it is plausibly the relay. Same ramp, opposite attributions -- so
          # the line rate travels with every receipt rather than being re-derived.
          # Virtualised NICs report -1 or nothing: that is `unknown`, never a
          # spec-sheet guess. `unknown` means fall back to an empirical ceiling.
          dev=$(ip -j route get 1.1.1.1 2>/dev/null | jq -r '.[0].dev // empty' || true)
          speed=$(cat "/sys/class/net/$dev/speed" 2>/dev/null || true)
          case "$speed" in ''|*[!0-9]*|0) speed=unknown ;; esac
          # A paravirtual NIC (hv_netvsc, virtio_net) reports the SYNTHETIC link
          # speed, not provisioned bandwidth, so a well-formed number there is
          # not a line rate -- the same spec-sheet substitution the `unknown`
          # branch exists to prevent, just sourced from the kernel. Allowlist
          # PHYSICAL drivers rather than denylisting virtual ones: the miss
          # directions are asymmetric. A denylist miss (ena, gve, a veth inside
          # a container) ships a synthetic integer as authoritative; an
          # allowlist miss emits `unknown` on a real NIC, which falls back to
          # the empirical ceiling -- what the consumer does anyway.
          drv=$(ethtool -i "$dev" 2>/dev/null | awk '/^driver:/{print $2}' || true)
          reported=$speed
          case "${drv:-}" in
            ixgbe|i40e|ice|igb|igc|e1000e|tg3|bnxt_en|mlx4_en|mlx5_core|atlantic) ;;
            *) speed=unknown ;;
          esac
          # `nic_speed_mbps_reported` keeps the raw reading: it is what caught
          # the synthetic value (50000 vs 100000 across two runs 2m23s apart)
          # and it distinguishes "sysfs said nothing" from "sysfs said something
          # synthetic". `nic_speed_mbps` is the only authoritative field.
          echo "egress_dev=${dev:-unknown} nic_speed_mbps=$speed nic_driver=${drv:-unknown} nic_speed_mbps_reported=${reported}"
          # BLO-26574 Amendment 12g, Finding 1: on a PRE-7ec53567 relay (every
          # one deployed today) tunnel state is keyed on the outer source
          # ADDRESS, so this rig's fan-out ceiling is its count of distinct
          # PUBLIC source addresses (k), not its process count. A routable v6
          # /64 is the cheap way to raise k -- measure whether this vantage has
          # one rather than assuming it in either direction. Against a relay
          # carrying linux-amt 7ec53567 the address stops being the unit at all
          # (see the k comment below), and v6 stops being the lever.
          # CAPABILITY ONLY: it does not raise k until a gateway actually binds
          # a distinct address, so it is recorded here and never read by the
          # verdict. `no` answers the question outright; `yes` makes relay v6
          # reachability the follow-up, not a licence to ramp.
          v6n=$(ip -j -6 addr show scope global 2>/dev/null \
                | jq '[.[].addr_info[]? | select(.family=="inet6" and .scope=="global")] | length' 2>/dev/null || echo 0)
          v6ok=no
          if curl -fsS -6 -m 5 -o /dev/null https://api6.ipify.org 2>/dev/null; then v6ok=yes; fi
          echo "ipv6_global_addrs=${v6n:-0} ipv6_egress=$v6ok"
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ⚠ KEEP THIS STEP FREE OF `${{ }}`. BLO-38732: this block is 30,569
      # characters of YAML scalar, and GitHub refuses a `run:` block at 21,000 --
      # but ONLY when it contains an interpolation, because that is what compiles
      # it to a `format(...)` expression. The revision label below used to read
      # `${{ github.sha }}`; at 30,584 scalar chars that one expression took the
      # WHOLE WORKFLOW unparseable from 2026-10-01T07:12Z, i.e. the detector went
      # silent while every surface said `completed/failure` with zero jobs.
      # `$GITHUB_SHA` is the same value from the runner env and costs nothing.
      # Measured: 19,709 scalar + 1 expr parsed (43a6ba2d); 30,584 + 1 did not;
      # 30,569 + 0 does. Read the SCALAR, not the indented file text -- the
      # 10-space indent over ~346 lines inflates it ~3.4k and is what made the
      # original bracket look like a refutation of the 21,000 limit.
      # Held by tests/workflow_expression_budget_test.sh.
      - name: amt-verify (real client, public vantage)
        run: |
          # Ally review (head 0ad7198), Important (2). `tunnels` is an unbounded
          # workflow_dispatch input used directly as the process-launch count,
          # so a typo or a large value spends the runner's fds, source ports and
          # CPU before any measurement starts -- and `seq 1 abc` / `[ abc -gt 1 ]`
          # fail in the middle of the launch loop rather than at the boundary.
          # 256 is the documented top of this issue's ramp (BLO-26574 sweep
          # parameters: `... 96, 128, 192, 256`) and sits above every candidate
          # harness binder on a 4-vCPU runner, so it bounds a typo without
          # clipping a legitimate step. Validated from $TUNNELS (env), never by
          # interpolating the input into the script.
          MAX_TUNNELS=256
          case "$TUNNELS" in ''|*[!0-9]*)
            echo "::error::tunnels must be an integer in 1..$MAX_TUNNELS, got '$TUNNELS'"; exit 92 ;;
          esac
          if [ "$TUNNELS" -lt 1 ] || [ "$TUNNELS" -gt "$MAX_TUNNELS" ]; then
            echo "::error::tunnels must be an integer in 1..$MAX_TUNNELS, got '$TUNNELS'"; exit 92
          fi
          docker pull -q $IMAGE || docker build -q -t $IMAGE \
            --label org.opencontainers.image.revision=$GITHUB_SHA .
          echo "image_digest=$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}local-build{{end}}' $IMAGE)"
          # BLO-21823 AC#3 wants the client commit alongside the artifact hash.
          echo "client_commit=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' $IMAGE)"
          set +e
          # BLO-33456. `mmtp.gaps` says packets went missing; it does NOT say
          # where. The kernel already counts the one candidate that is cheapest
          # to rule in or out, so read it rather than dispatching a study:
          # `Udp: RcvbufErrors` is datagrams dropped because the socket receive
          # buffer was full -- i.e. this receiver fell behind, not the path.
          # `--network host` puts the container in THIS netns, so the runner's
          # /proc/net/snmp is the container's counter.
          #
          # Three-way partition of a gap, none of which needs a source counter:
          #   lagged_count > 0  -> userspace consumer behind (broadcast channel)
          #   RcvbufErrors > 0  -> kernel socket buffer overran (reader behind)
          #   both 0, gaps > 0  -> loss upstream of this host
          # The known-clean sessions (gaps: 0) are the built-in negative control:
          # attribution is by COVARIATION across lossy/clean, not by a threshold.
          #
          # Caveat, and it is real: this counter is netns-WIDE, not per-socket.
          # On an otherwise-idle hosted runner ours is the only meaningful UDP
          # traffic, but a non-zero delta is evidence about the netns, so do not
          # read a small one as proof it was us.
          #
          # That partition localises a gap to THIS HOST or not. It cannot place
          # an upstream gap on the shared leg vs. on this receiver's own leg
          # downstream of the relay's per-tunnel fan-out -- and `gaps` /
          # `gap_events` cannot either: BLO-33456 pair E had two receivers on
          # different /8s report 501 / 34 identically, which fits both "they
          # share the lossy leg" and "the source emitted a discontinuous
          # sequence, so nothing was lost". `mmtp.gap_positions` settles it.
          # Run two CONCURRENT probes (check overlap via data_started_at_ms /
          # data_ended_at_ms, NOT dispatch time), then over the two receipts:
          #
          # Compare ABSENT SEQUENCE NUMBERS, never the {pid,after,missing}
          # objects. A burst straddling the two receivers differently yields
          # the SAME absent range described by different triples -- e.g.
          # {1,6435823,50} vs {1,6435824,49}, both ending at 6435873 -- so an
          # object-equality compare scores them as disjoint on BOTH sides and
          # invents per-receiver loss that is not there. Measured 2026-09-14 on
          # runs 34810353292 / 34810354915: object-compare reports 4 a_only +
          # 4 b_only events carrying 550 packets; the true divergence is
          # 2 packets. A 275x overstatement, in the direction that manufactures
          # a per-receiver verdict.
          #
          #   jq -n --slurpfile a a/report.json --slurpfile b b/report.json '
          #     def absent: [.mmtp.gap_positions[] as $g
          #                  | range($g.after+1; $g.after+$g.missing+1)
          #                  | "\($g.pid):\(.)"] | sort;
          #     ($a[0]|absent) as $A | ($b[0]|absent) as $B |
          #     {a:($A|length), b:($B|length),
          #      shared:(($A-($A-$B))|length),
          #      a_only:(($A-$B)|length), b_only:(($B-$A)|length)}'
          #
          #   shared >> a_only+b_only -> stream-as-delivered (shared leg, or
          #                              source-side sequence discontinuity)
          #   mostly disjoint         -> per-receiver loss below the fan-out
          #
          # Both arms behind ONE relay cannot separate source-side discontinuity
          # from loss in that relay's own ingest: both are "upstream of fan-out".
          # Electing between them needs two receivers behind DIFFERENT relays.
          #
          # Truncation is visible as gap_positions|length < gap_events; a
          # truncated list makes `shared` a lower bound, not a verdict.
          # Both /proc paths are seams, not configuration. Production always
          # takes the default; the unit test injects fixtures so that the guards
          # below are exercised against THIS shell rather than a copy of it that
          # can drift. Every other stub in that test is a PATH-shadowed binary,
          # which cannot work for a file read.
          PROC_SNMP="${PROC_SNMP:-/proc/net/snmp}"
          PROC_SOFTNET="${PROC_SOFTNET:-/proc/net/softnet_stat}"
          udp_counters() { awk '/^Udp:/{n++; if (n==2) print}' "$PROC_SNMP"; }
          softnet_lines() { cat "$PROC_SOFTNET" 2>/dev/null; }
          #
          # ---- POSITIVE CONTROL for RcvbufErrors (BLO-33636) --------------------
          #
          # The width check further down establishes CAPTURE validity. It says
          # nothing about FIELD RESPONSIVENESS, and that gap is not academic:
          # the prediction this leg exists to test is "udp_delta non-zero on N=3,
          # zero on N=1". A DEAD DIAL reads zero on BOTH -- which presents as
          # REFUTING the receive-side hypothesis and re-indicting the relay. It
          # fails in the expensive direction and is indistinguishable from a real
          # refutation. The known-clean sessions cannot catch it either: a dead
          # counter and a quiet one both read 0.
          #
          # So drive the counter deliberately and watch it move. Loopback UDP
          # into a deliberately tiny SO_RCVBUF that is never read from, in this
          # netns -- the same netns `--network host` gives the probe containers,
          # so it is the same counter they will be judged by.
          #
          # ⚠ ORDERING IS A CORRECTNESS CONSTRAINT, NOT A PREFERENCE (PlatformSRE
          # review, 2026-10-01). The control's own drops land in the SAME netns-wide
          # counter the probe reads. It must therefore run to COMPLETION BEFORE
          # `udp_before` is sampled, so its drops sit in the baseline and cancel
          # out of `after - before`. A control still running concurrently with the
          # probe is a contaminant, not a control. It is called synchronously here
          # and never backgrounded; `tests/probe_counters_test.sh` asserts the
          # source order so an edit cannot quietly reverse it.
          #
          # ⚠ A CONTROL LICENSES THE INSTRUMENT, NOT THE THRESHOLD. Forcing a 4 KiB
          # buffer with a flood proves the counter is not dead. It does NOT
          # establish that the probe's ~1.3k pkt/s at the default rcvbuf would move
          # it. The magnitudes are therefore emitted NEXT TO the verdict, so a
          # downstream zero can only claim what the control licenses: "no pressure
          # at or above the forced scale", never "no pressure".
          #
          # Fails closed on the COUNTER, never on the run: if python3 is missing or
          # the control does not fire, emit `udp_counter_unvalidated` and carry on.
          # A consumer seeing that token must record the N=1/N=3 reading as
          # UNTESTED -- never as refuted.
          udp_control_out=$(PROC_SNMP="$PROC_SNMP" python3 - <<'PYCTL' 2>/dev/null || true
          import socket, time, os

          SNMP = os.environ.get("PROC_SNMP", "/proc/net/snmp")
          DATAGRAMS, PAYLOAD, RCVBUF = 20000, 1024, 2048

          def rcvbuf_errors():
              # Label-keyed off the `Udp:` header for the same reason the shell
              # delta is: a kernel that adds a field must not shift the value
              # onto a neighbour. Returns None when the field is unreadable, so
              # "cannot measure" stays distinct from "measured zero".
              try:
                  lines = [l for l in open(SNMP) if l.startswith("Udp:")]
                  hdr, val = lines[0].split(), lines[1].split()
              except (OSError, IndexError):
                  return None
              if len(hdr) != len(val) or "RcvbufErrors" not in hdr:
                  return None
              return int(val[hdr.index("RcvbufErrors")])

          def rmem_default():
              try:
                  return int(open("/proc/sys/net/core/rmem_default").read().strip())
              except (OSError, ValueError):
                  return -1

          before = rcvbuf_errors()
          rx = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          rx.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, RCVBUF)
          rx.bind(("127.0.0.1", 0))
          # The kernel doubles the requested value and enforces a floor, so report
          # what it ACTUALLY gave us -- the requested number would misstate the
          # forcing magnitude this control is being recorded for.
          effective = rx.getsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF)
          port = rx.getsockname()[1]
          tx = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          buf = b"\0" * PAYLOAD
          t0 = time.monotonic()
          sent = 0
          for _ in range(DATAGRAMS):
              try:
                  tx.sendto(buf, ("127.0.0.1", port))
                  sent += 1
              except OSError:
                  # ENOBUFS on the send side is local pressure, not a receiver
                  # drop. Keep going; `sent` records what actually went out.
                  pass
          elapsed_ms = int((time.monotonic() - t0) * 1000)
          # Nothing is ever read from rx: that is the whole mechanism. Close only
          # after the send loop, so every datagram meets a full buffer.
          tx.close(); rx.close()
          after = rcvbuf_errors()

          delta = None if (before is None or after is None) else after - before
          rate = int(sent * 1000 / elapsed_ms) if elapsed_ms > 0 else -1
          fired = delta is not None and delta > 0
          print(
              "udp_control=%s ctl_rcvbuf_bytes=%d ctl_rmem_default_bytes=%d "
              "ctl_datagrams_sent=%d ctl_payload_bytes=%d ctl_elapsed_ms=%d "
              "ctl_rate_pps=%d ctl_RcvbufErrors_delta=%s"
              % (
                  "fired" if fired else "unvalidated",
                  effective, rmem_default(), sent, PAYLOAD, elapsed_ms, rate,
                  "unreadable" if delta is None else delta,
              )
          )
          PYCTL
          )
          # An empty `udp_control_out` means python3 was absent or the interpreter
          # itself died -- treat exactly as a control that did not fire.
          case "$udp_control_out" in
            udp_control=fired*) echo "$udp_control_out" ;;
            udp_control=*)      echo "$udp_control_out"; echo "udp_counter_unvalidated" ;;
            *)                  echo "udp_control=unvalidated ctl_error=no_output"
                                echo "udp_counter_unvalidated" ;;
          esac
          # ---- end positive control --------------------------------------------
          #
          # Sampled only now: everything the control dropped is in the baseline.
          udp_before=$(udp_counters)
          softnet_before=$(softnet_lines)
          t0=$(date +%s%3N)
          # BLO-26574 step 1 (harness ceiling). One tunnel per PROCESS, all in
          # the runner netns. At TUNNELS=1 this is byte-identical in behaviour
          # to the single `docker run` it replaces, including the exit code.
          pids=""
          for i in $(seq 1 "$TUNNELS"); do
            docker run --rm --network host $IMAGE \
              --no-driad --relay "$RELAY" --source "$SOURCE" --group "$GROUP" \
              --timeout "$TIMEOUT" --packet-count "$PACKETS" --json --verbose \
              >"report-$i.json" 2>"verbose-$i.log" &
            pids="$pids $!"
          done
          # Record what the RIG could even launch, before asking what the relay
          # did. A launch that fails on fds or source ports is the harness
          # ceiling and must not be read as a relay result.
          echo "tunnels_requested=$TUNNELS"
          echo "ulimit_n_soft=$(ulimit -Sn) ulimit_n_hard=$(ulimit -Hn)"
          echo "nproc=$(nproc)"
          # BLO-26574 Amendment 12g, Finding 1. k is how many distinct tunnel
          # ENDPOINTS this rig can present; N_established can never exceed it.
          # Recorded so that a clean-looking receipt cannot be read as fan-out
          # it never generated, and READ BY THE VERDICT below -- as telemetry
          # alone it stopped nothing.
          #
          # What an endpoint is depends on the relay BUILD, so this default is
          # version-scoped, not a timeless property of AMT. Verified from source
          # 2026-09-18, not inferred:
          #
          #  - Relays built BEFORE linux-amt 7ec53567 key tunnel state on the
          #    outer source ADDRESS alone. A later Request from the same address
          #    steals the one tunnel (`send:` overwrites source_port and nonce)
          #    and the earlier gateway's Membership Updates are then dropped as
          #    `Invalid MAC`. N processes in one `--network host` netns produce
          #    ONE tunnel, not N -- so k=1 and any tunnels>1 run is VOID.
          #
          #  - linux-amt 7ec53567 (2026-09-13, BLO-33636 / linux-amt#223) keys
          #    on the (address, port) ENDPOINT per RFC 7450 s4.2.2 --
          #    `amt_request_handler` amt.c:3736, `amt_update_handler` amt.c:3333.
          #    Against such a relay one source address presents many endpoints
          #    via source ports, so k is NOT 1 and fan-out from a single runner
          #    becomes measurable.
          #
          # ⚠ THE "every relay is pre-fix" PREMISE EXPIRED 2026-09-28. Prod .128
          # was rolled onto the endpoint-key module at 18:57Z (BLO-34416; amt
          # srcversion 816FB7EE48A5DB9F6081D0D on k8s-data-2), and run
          # 36474867098 then took 68,487 / 68,487 / 68,462 packets on THREE
          # concurrent tunnels from ONE public address -- i.e. k=3, measured.
          # Staging .96 is NOT known rolled, and the prod relay pod can
          # reschedule onto a still-unrolled node (data-1/3/4 are relay-eligible
          # and unrolled as of 2026-09-28), so k is a per-run property now, not
          # a constant. K below therefore stays 1 as a TELEMETRY floor only; the
          # VOID verdict is taken from what the run measured, not from it.
          #
          # ⚠ When that deploy lands, k is bounded by the relay, NOT by the rig:
          # `AMT_MAX_TUNNELS_PER_SOURCE` defaults to 16 (amt.h:573; global
          # `AMT_MAX_TUNNELS` 128), overridable via
          # IFLA_AMT_MAX_TUNNELS_PER_SOURCE. A one-runner ramp that reads the
          # 17th failure as the relay's fan-out knee would be measuring the
          # per-source cap -- the same misattribution this VOID exists to
          # prevent, with a different number. Set k to the deployed relay's
          # actual per-source cap, in the same commit that deploys it.
          #
          # Deliberately NOT a workflow input: a dispatch caller must not be
          # able to declare a fan-out capability the rig and relay do not have.
          K="${DISTINCT_SOURCE_IPS:-1}"
          echo "distinct_source_ips=$K"
          i=0; ok=0
          for p in $pids; do
            i=$((i+1))
            wait "$p"; s=$?
            # BLO-26574 (CTO ruling item 5). amt-verify exits 1 on
            # `outcome: timeout`, which is the NORMAL end of a bounded sample --
            # so the exit code alone cannot separate a healthy 90s probe from a
            # tunnel that received nothing. packet_count is the verdict: >0 is a
            # successful sample whatever the outcome, ==0 is a failure. Fails
            # closed -- a missing, empty or unparseable receipt lands on 0.
            pc=$(jq -r '.packet_count // 0' "report-$i.json" 2>/dev/null || echo 0)
            case "$pc" in ''|*[!0-9]*) pc=0 ;; esac
            [ "$pc" -gt 0 ] && ok=$((ok+1))
            echo "tunnel_exit[$i]=$s packet_count[$i]=$pc"
          done
          t1=$(date +%s%3N)
          udp_after=$(udp_counters)
          softnet_after=$(softnet_lines)
          set -e
          # Delta, labelled off the header line so a kernel that adds a field
          # cannot silently shift `RcvbufErrors` onto a neighbour's value.
          #
          # Guard on ABSENCE, not on value. If any of the three lines is short or
          # empty -- /proc/net/snmp unreadable, `Udp:` block absent or renamed --
          # the unguarded form prints a complete, well-formed, entirely fake
          # `udp_delta ... RcvbufErrors=0`, because `A[i]-B[i]` on unset fields is
          # 0-0. A consumer thresholding on `RcvbufErrors=0` cannot tell that from
          # a real zero. So: require all three field counts to agree, else emit
          # `udp_delta_invalid` and NO `udp_delta` line at all -- a grep for
          # `RcvbufErrors=` then finds nothing, which is the honest answer.
          #
          # Deliberately does NOT exit non-zero: `set -e` is in force further down
          # and a failed step discards report.json, re-introducing the AC1 defect
          # this issue exists to fix. Fail closed on the counter, not on the run.
          #
          # This is about CAPTURE validity only. FIELD responsiveness is a
          # separate question and is answered separately, by the positive control
          # above: it drives `RcvbufErrors` non-zero in this netns before the
          # baseline is taken, and emits `udp_counter_unvalidated` when it cannot.
          # Read the two together -- a `udp_delta ... RcvbufErrors=0` alongside
          # `udp_counter_unvalidated` is NOT a measured zero.
          awk -v hdr="$(awk '/^Udp:/{print; exit}' "$PROC_SNMP")" \
              -v b="$udp_before" -v a="$udp_after" '
            BEGIN {
              nh = split(hdr, H); nb = split(b, B); na = split(a, A)
              if (nh < 2 || nh != nb || nh != na) {
                printf "udp_delta_invalid hdr=%d before=%d after=%d\n", nh, nb, na
                exit 0
              }
              out = ""
              for (i = 2; i <= nh; i++) out = out sprintf(" %s=%d", H[i], A[i] - B[i])
              printf "udp_delta%s\n", out
            }'
          # ---- /proc/net/softnet_stat delta (BLO-33636) -------------------------
          #
          # `RcvbufErrors` counts drops at the SOCKET buffer. It cannot see a drop
          # that happened UPSTREAM of the socket -- in the per-CPU backlog or at
          # the NIC. So a `udp_delta ... RcvbufErrors=0` is not "this host did not
          # drop"; it is "this host did not drop AT THE SOCKET". softnet_stat is
          # the counter for the hop before it.
          #
          # ⚠ THIS FILE HAS NO HEADER LINE, so the label-keying that protects
          # `udp_delta` HAS NO ANALOGUE HERE (PlatformSRE, 2026-10-01, measured on
          # 6.8.0-142: 15 bare hex columns, no labels). Position is the only
          # addressing available and the column count is kernel-dependent. The
          # honest substitutes are (a) a WIDTH CHECK -- emit `softnet_delta_invalid`
          # if the field count or the CPU count moves between before and after --
          # and (b) emitting the RAW LINES either way, so a reader who finds the
          # layout differs on their kernel can re-derive the numbers rather than
          # having to trust this parse.
          #
          # ⚠ FIELD INDICES ARE PINNED EXPLICITLY because "column 2" is ambiguous
          # between 0- and 1-indexing, and the wrong pick reports a large
          # time_squeeze as drops. In awk's 1-based numbering:
          #     $1 processed   $2 dropped   $3 time_squeeze
          # Confirmed against a live 6.8.0-142 host where $2=0 while $3=0x899=2201.
          #
          # BOTH are emitted, because that same host is the argument for it: a
          # dropped-only read would have reported "no backlog pressure" on a host
          # that had squeezed 2201 times. time_squeeze is NAPI budget exhaustion --
          # the backlog pressure immediately upstream of the socket -- so it is the
          # better dial for the receive-side hypothesis, and it is free in the same
          # read. Which one is implicated is NOT asserted here; both are recorded
          # and the data elects.
          #
          # Counters are per-CPU and summed. Same fail-closed posture as `udp_delta`:
          # on any validity failure emit NO `softnet_delta` line at all, so a grep
          # for `dropped=` finds nothing rather than a fabricated zero.
          printf '%s\n' "softnet_raw_before=$(printf '%s' "$softnet_before" | tr '\n' '|')"
          printf '%s\n' "softnet_raw_after=$(printf '%s' "$softnet_after" | tr '\n' '|')"
          awk -v b="$softnet_before" -v a="$softnet_after" '
            # mawk has no strtonum(), and the runner awk is mawk. Parse hex by
            # hand so this does not silently depend on gawk. Returns -1 on any
            # non-hex character, which the caller treats as a validity failure.
            function hex2dec(s,   i, c, v, n) {
              s = tolower(s); n = 0
              if (length(s) == 0) return -1
              for (i = 1; i <= length(s); i++) {
                c = substr(s, i, 1)
                v = index("0123456789abcdef", c) - 1
                if (v < 0) return -1
                n = n * 16 + v
              }
              return n
            }
            # Sums $2 and $3 over every CPU line, and reports the field count and
            # line count so the caller can require they agree across the samples.
            function scan(blob, agg,   i, nl, lines, nf, w, d, s) {
              nl = split(blob, lines, "\n")
              agg["cpus"] = 0; agg["dropped"] = 0; agg["squeeze"] = 0; agg["nf"] = 0
              for (i = 1; i <= nl; i++) {
                if (lines[i] ~ /^[ \t]*$/) continue
                # Default FS semantics: splits on whitespace RUNS and ignores
                # leading/trailing whitespace, so a space-indented line does not
                # produce a phantom empty first field and shift every index by one.
                nf = split(lines[i], w)
                if (agg["nf"] == 0) agg["nf"] = nf
                else if (nf != agg["nf"]) { agg["nf"] = -1; return }
                # No separate `nf < 3` check: a row too short to have the fields
                # leaves w[2]/w[3] unset, and hex2dec refuses an empty string.
                # Mutation-testing showed an explicit width check here could not
                # be made to fail -- hex2dec caught every case first -- and a
                # guard with no failing mutation is a comment, not a guard.
                d = hex2dec(w[2]); s = hex2dec(w[3])
                if (d < 0 || s < 0) { agg["nf"] = -1; return }
                agg["dropped"] += d; agg["squeeze"] += s; agg["cpus"]++
              }
            }
            BEGIN {
              scan(b, B); scan(a, A)
              if (B["nf"] <= 0 || A["nf"] <= 0 || B["cpus"] == 0 || A["cpus"] == 0) {
                printf "softnet_delta_invalid reason=unparseable nf_before=%d nf_after=%d cpus_before=%d cpus_after=%d\n", \
                  B["nf"], A["nf"], B["cpus"], A["cpus"]; exit 0
              }
              if (B["nf"] != A["nf"] || B["cpus"] != A["cpus"]) {
                printf "softnet_delta_invalid reason=shape_changed nf_before=%d nf_after=%d cpus_before=%d cpus_after=%d\n", \
                  B["nf"], A["nf"], B["cpus"], A["cpus"]; exit 0
              }
              # A counter that went backwards means CPU renumbering, hotplug or a
              # wrap -- the subtraction is then meaningless, not small.
              if (A["dropped"] < B["dropped"] || A["squeeze"] < B["squeeze"]) {
                printf "softnet_delta_invalid reason=went_backwards nf=%d cpus=%d\n", A["nf"], A["cpus"]; exit 0
              }
              printf "softnet_delta dropped=%d time_squeeze=%d cpus=%d nf=%d\n", \
                A["dropped"] - B["dropped"], A["squeeze"] - B["squeeze"], A["cpus"], A["nf"]
            }'
          # ---- end softnet_stat delta ------------------------------------------
          echo "tunnels_receiving=$ok/$TUNNELS"
          # BLO-27413: receiver-side saturation witness. The relay fans one
          # multicast stream into N unicast tunnels, so the receiving vantage
          # absorbs N x stream_bitrate. Without a per-tunnel bitrate there is no
          # way to tell a relay knee from the receiver's own ceiling -- which is
          # the same class of error as the five weeks that measured probe vantage.
          #
          # BLO-33456: prefer report.json's `elapsed_ms` over this shell-measured
          # one. This `t1-t0` includes `docker run` container startup (~459ms,
          # solved for over two runs) and so overstates elapsed / understates
          # rate on short samples; the in-process one starts once subscribe()
          # has completed, so it excludes the handshake too.
          # Kept only as an outer bound and a cross-check on that constant.
          echo "wallclock_elapsed_ms=$((t1-t0))"
          for i in $(seq 1 "$TUNNELS"); do
            echo "--- report-$i.json ---"; cat "report-$i.json" || true
          done
          # verbose.log is per-tunnel and large; dump it only for the 1-tunnel
          # case, where it is the handshake trace someone actually reads.
          # `if`, not `[ ] && { }` — the latter returns 1 when TUNNELS != 1 and
          # GitHub runs this under `bash -e`, so it would abort every ramp step.
          if [ "$TUNNELS" = 1 ]; then echo '--- verbose-1.log ---'; cat verbose-1.log || true; fi
          # Ally review (head ada02515): TUNNELS=1 must stay artifact-compatible
          # with the single `docker run` this step replaced -- downstream
          # consumers fetch `report.json` and `verbose.log` BY NAME, and the
          # indexed rename would have made them silently miss the receipt.
          # Keep the indexed files as the uniform internal contract and add the
          # legacy names as aliases for the one-tunnel case, so both shapes
          # resolve. Globs below are `report*` / `verbose*` (no dash) to cover
          # the aliases as well as the indexed files.
          if [ "$TUNNELS" = 1 ]; then cp report-1.json report.json; cp verbose-1.log verbose.log; fi
          sha256sum report*.json verbose*.log
          # BLO-26574: the (S,G) GUARD. The dispatch defaults are cast
          # (69.25.95.192, 232.1.1.60); a caller who omits inputs silently
          # measures a different stream than intended, and until now the `sg=`
          # echo was the only tell. That cost a retracted 2.75x-low per-tunnel
          # figure. report.json carries the tuple the client actually joined, so
          # assert it rather than printing it: a receipt that disagrees with the
          # caller's intent fails the job.
          for i in $(seq 1 "$TUNNELS"); do
            got_s=$(jq -r '.source // "null"' "report-$i.json")
            got_g=$(jq -r '.group  // "null"' "report-$i.json")
            if [ "$got_s" != "$SOURCE" ] || [ "$got_g" != "$GROUP" ]; then
              echo "::error::receipt $i joined ($got_s,$got_g), caller asked for ($SOURCE,$GROUP)"
              exit 90
            fi
          done
          echo "sg_guard=ok ($SOURCE,$GROUP) on $TUNNELS receipt(s)"
          # Ally review (head 0ad7198), Important (1). `fanout_capable` used to
          # be telemetry the verdict never read, so an N-tunnel run whose
          # receipts all carried data went GREEN for a measurement this step had
          # already declared itself incapable of making. The relay keys tunnel
          # state on outer source ADDRESS alone (amt.c:3692), so N_established
          # <= k and TUNNELS > k cannot generate fan-out however clean the
          # receipts look (BLO-26574 AC; Amendment 12g, Finding 1).
          #
          # Checked BEFORE the packet_count verdict on purpose: with k=1 the
          # later tunnels receive nothing, so the aggregate check would exit 1
          # saying "N-1 of N tunnels received no data" -- which reads as a
          # DELIVERY failure of the relay when the truth is that the rig never
          # established N tunnels to begin with. That misattribution is the
          # whole hazard; a distinct code and message is the fix.
          #
          # The launch telemetry above (tunnels_requested, ulimit_n_*, nproc,
          # per-tunnel exits) stays valid as a HARNESS-ceiling reading, and
          # receipts still upload via `if: always()`.
          # ⚠ VOID is now decided by MEASUREMENT, not by a hardcoded k. The old
          # form was `TUNNELS -gt K` with K pinned to 1, which encoded the
          # premise "every deployed relay is pre-fix". That premise died on
          # 2026-09-28 and the guard then failed the very run that disproved it:
          # 36474867098 printed `tunnels_receiving=3/3` and still exited 91,
          # citing a pre-fix relay, against data showing the relay is not.
          #
          # `ok` is the count of tunnels that actually received data, so ok > K
          # IS the demonstration that K source addresses presented more than K
          # endpoints -- no version lookup, no per-relay table, nothing to rot.
          # VOID now fires only when fan-out was NOT demonstrated (ok <= K with
          # TUNNELS > K), which is exactly the case where "harness ceiling" and
          # "relay keys on address alone" are indistinguishable and the
          # misattribution below is possible.
          #
          # ⚠ Ally review (head fed8b706), Important (1): this condition was
          # written with the literal 1 on both sides, which is byte-identical
          # today (K is 1; DISTINCT_SOURCE_IPS is set nowhere in this file) but
          # silently WRONG the moment the rig presents distinct addresses. The
          # "ok >= 2 proves one address presented two endpoints" inference holds
          # only while K == 1: with DISTINCT_SOURCE_IPS=3, a 3-tunnel run spread
          # over 3 addresses yields ok=3, the guard stays silent, and the run
          # reports fan-out that was never demonstrated -- a false GREEN on the
          # exact measurement this workflow exists to make. The error string
          # already printed k=$K, so message and condition disagreed. K is the
          # instrument; use it. And note K==1 is itself a dated premise with the
          # same shelf life as the one that expired above -- check it, do not
          # inherit it.
          if [ "$TUNNELS" -gt "$K" ] && [ "$ok" -le "$K" ]; then
            echo "::error::VOID as a relay result: $TUNNELS tunnels requested from k=$K source address(es), but only $ok received data -- so no fan-out was established. With ok >= 1 this run cannot distinguish a harness ceiling from a relay that keys tunnel state on source ADDRESS alone (pre-linux-amt-7ec53567 behaviour); ok=0 is neither, since address-alone keying still delivers to one tunnel, so it is a total forwarding failure or a dead harness (rerun with tunnels=1 to route it). Check the relay the pod is actually on: an unrolled node reproduces exactly this. Harness-ceiling telemetry above is still valid."
            exit 91
          fi
          # ⚠ Ally review (head fed8b706), Important (2). The partial knee --
          # ok in K+1..TUNNELS-1 -- is a relay at its per-source cap, which IS
          # forwarding, to `ok` tunnels. Falling through to the aggregate
          # verdict below would set ZERO_DATA=1 and file "[amt-probe] relay not
          # forwarding to public gateways", i.e. an OUTAGE row for a capability
          # reading. That false row then swallows the next real alert as a
          # comment -- the hazard named at the aggregate verdict itself. Split
          # out with its own code and message, exactly as 91 was split out of
          # the aggregate for the same misattribution reason.
          #
          # ZERO_DATA is deliberately NOT set: arm 1 of the routing gate needs
          # it, and arm 2 needs event_name == 'schedule'. The scheduled probe
          # runs tunnels=1 (the input default), so this branch is unreachable
          # on a schedule -- it needs a deliberate tunnels>=K+2 dispatch, i.e.
          # the AMT_MAX_TUNNELS_PER_SOURCE ramp anticipated above. Neither arm
          # fires, which is the intent: a knee is a measurement, not an alert.
          if [ "$ok" -gt "$K" ] && [ "$ok" -lt "$TUNNELS" ]; then
            echo "::error::KNEE, not an outage: $ok of $TUNNELS tunnels received data from k=$K source address(es). Fan-out IS established (ok > k), so the relay is forwarding; $((TUNNELS - ok)) tunnel(s) short is a per-source capability ceiling (AMT_MAX_TUNNELS_PER_SOURCE defaults to 16, amt.h:573) or a harness ceiling. Read tunnels_requested/ulimit_n_*/nproc above to tell those apart. NOT routed as a forwarding failure."
            exit 93
          fi
          # A probe that cannot fail is not a probe: surface the client's verdict
          # as the job's verdict. Receipts still upload via `if: always()`.
          #
          # Ally review (head ada02515): this used to `exit "$status"`, which
          # carried TUNNEL 1's exit code -- so a healthy first tunnel made the
          # whole N-tunnel step green even when every later tunnel failed, and
          # `tunnels_exit_zero` was printed but never consulted. The verdict is
          # now the aggregate over packet_count, not tunnel 1's exit status.
          #
          # Deliberate divergence from that review, flagged rather than taken
          # quietly: it asked to "keep the single-tunnel exit code unchanged",
          # but the CTO ruling (item 5) is that the single-tunnel code is itself
          # the defect -- `outcome: timeout` with packet_count > 0 is a
          # SUCCESSFUL bounded sample and must exit 0. Both cases are therefore
          # decided by packet_count. Consumers should still parse packet_count
          # rather than the run conclusion.
          if [ "$ok" -ne "$TUNNELS" ]; then
            echo "::error::$((TUNNELS - ok)) of $TUNNELS tunnel(s) received no data (packet_count=0)"
            # The routing step keys on THIS verdict, not on failure(): exits
            # 90/91/92/93, an ipify blip or a login error also fail the job, and
            # filing those as "relay not forwarding" would open a false
            # [amt-probe] issue that swallows the next real alert as a comment.
            # $GITHUB_ENV is processed after the step whatever its exit code.
            echo "ZERO_DATA=1" >> "$GITHUB_ENV"
            exit 1
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-verify-receipt
          path: |
            report*.json
            verbose*.log
      # BLO-33585. A red run in a list nobody reads is not a detection path.
      # Scheduled-workflow failures email only the account that last touched the
      # cron -- here a bot -- so without this step the detector is silent by
      # construction, which is the exact failure this issue is about.
      #
      # DEDUPED, and that is not tidiness. A forwarding stop lasts tens of
      # minutes and this cron fires every 15, so the naive version files N
      # issues for ONE fault -- the cardinality mistake that turned 343 alert
      # rows into 334 distinct pods on BLO-28616. One open issue per fault,
      # comments thereafter, so the row count tracks FAULTS and not minutes.
      #
      # Matched on the exact title rather than a label: a label that does not
      # exist makes `gh issue create --label` fail, and a detector whose
      # notification step errors is worse than one that never fires, because the
      # run is already red and the second failure is invisible underneath it.
      # Exact, not a prefix: the title carries (source,group), and a prefix match
      # let the positive control's open .99 row swallow every production alert.
      #
      # TWO causes, two rows. ZERO_DATA is the relay verdict. Any other bad end
      # on a scheduled run (checkout, registry login, the vantage receipt,
      # amt-verify's guard exits 90/91/92/93, or the job cancelled by its own
      # `timeout-minutes`) means the DETECTOR stopped, which is
      # indistinguishable from a healthy relay unless it is filed too. It gets
      # its own `[amt-probe][infra]` title so the two diagnoses never share a
      # dedup row.
      #
      # ⚠ `inputs.route_failure`, NEVER `github.event.inputs.route_failure`.
      # The latter is always a STRING, so the literal "false" is truthy and
      # every dispatched measurement failure would file an issue -- the spam
      # this input exists to prevent, reintroduced by a one-word edit. Only the
      # `inputs` context honours `type: boolean`.
      # ⚠ `always() && job.status != 'success'`, NEVER `failure()`. A job that
      # exceeds `timeout-minutes` ends CANCELLED, not failed, so `failure()` is
      # false and a `failure()`-gated router is SKIPPED -- which is exactly the
      # wedge (docker pull stall, client not returning) that files nothing and
      # leaves a stopped detector looking like a healthy relay. Measured at
      # `timeout-minutes` above, run 36207352472. `job.status` is a context and
      # not a status function, so the `always()` is load-bearing too: without a
      # status function anywhere in the expression the runner prepends an
      # implicit `success() &&` and the step never runs on a bad end at all.
      #
      # The event guard is what makes `always()` safe. On `schedule` a
      # cancellation is EITHER a timeout or a deliberate cancel (the Actions
      # UI, `gh run cancel`, and a bulk cancel during an incident all reach a
      # scheduled run), and filing on both is the conservative direction: the
      # spurious case is one `[amt-probe][infra]` row that the next green
      # scheduled run closes ~15 min later, against a wedged detector that
      # would otherwise file nothing. An unopted dispatch (`route_failure`
      # false) still routes nothing.
      #
      # ⚠ NO `job.status != 'cancelled'` ON THE ZERO-DATA ARM. Ally review at
      # head d1c80d2, Important (1). The arms are mutually exclusive on
      # ZERO_DATA alone, so such a clause prevents no double-filing -- and
      # because arm 2 excludes `ZERO_DATA == '1'`, it is not a carve-out but a
      # HOLE: (cancelled, ZERO_DATA=1, schedule) satisfies neither arm, the
      # step is skipped, and a verdict that WAS reached routes nothing at all.
      # Reachable: ZERO_DATA is written at the verdict and the job then runs
      # `upload-artifact` on `always()`, so a slow receipt upload can carry the
      # job past `timeout-minutes` AFTER the relay has been judged -- dropping
      # the highest-value alert this detector exists to raise, which is the one
      # direction the header calls unacceptable.
      # The clause was never a design choice: it is the `!cancelled()` gate
      # this step used to carry, mechanically re-applied to arm 1 when that
      # gate was replaced by `always()` at d1c80d2. Fixing a shared guard by
      # pushing its old semantics onto one arm relocates the bug, it does not
      # remove it. ZERO_DATA is only ever set AFTER the aggregate verdict, so
      # its presence already proves the verdict was reached and trustworthy;
      # a later cancellation does not retract it. Case 8 pins the arms
      # exhaustive over `job.status != 'success'` on a scheduled run.
      - name: Route probe failure
        if: ${{ always() && ((env.ZERO_DATA == '1' && (github.event_name == 'schedule' || inputs.route_failure)) || (job.status != 'success' && env.ZERO_DATA != '1' && github.event_name == 'schedule')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE: ${{ inputs.source || '69.25.95.192' }}
          GROUP: ${{ inputs.group || '232.1.1.60' }}
          RELAY: ${{ inputs.relay || '69.25.95.128' }}
        run: |
          set -euo pipefail
          if [ "${ZERO_DATA:-}" != 1 ]; then
            title="[amt-probe][infra] detector failed before a verdict ($SOURCE,$GROUP)"
            body="Scheduled public-vantage probe **failed before reaching a verdict** for (\`$SOURCE\`, \`$GROUP\`) via \`$RELAY:2268\`.

          - Run: $RUN_URL
          - Detected at: $(date -u +%FT%TZ)

          This is not a relay finding: checkout, registry login, the vantage
          receipt, or an amt-verify guard (exit 90/91/92/93) failed -- or the job
          was cancelled by its own \`timeout-minutes\`, i.e. it wedged. While it
          persists the detector is not running, and a stopped detector reads as
          a healthy relay (BLO-33585). Fix the run, then close this row."
          else
          title="[amt-probe] relay not forwarding to public gateways ($SOURCE,$GROUP)"
          body="Scheduled public-vantage probe received **zero data** from \`$RELAY:2268\` for (\`$SOURCE\`, \`$GROUP\`).

          - Run: $RUN_URL
          - Detected at: $(date -u +%FT%TZ)

          The verdict is \`packet_count == 0\` on the receipt, **not** the run
          conclusion -- \`outcome: timeout\` is the normal end of a bounded
          sample, so conclusion alone cannot separate a healthy probe from a
          dead one (BLO-33585).

          Runbook: BLO-33585 findings. Nine relay-side series are dead for this
          purpose; do not re-key this detector to any of them."
          fi
          # A failed lookup falls through to create: a duplicate issue is a far
          # better failure than silence for a detector. Under `set -e` a bare
          # gh failure here would abort before either branch, which is the
          # invisible-notification mode the no-`--label` choice above avoids.
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --json number,title \
                | jq -r --arg t "$title" '[.[]|select(.title == $t)]|.[0].number // empty' || true)
          if [ -n "$n" ]; then
            if gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; then
              echo "routed=comment issue=$n"
            else
              echo "::error::routing failed: could not comment on issue #$n ($title)"
            fi
          else
            if url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"); then
              echo "routed=created issue=$url"
            else
              echo "::error::routing failed: could not create issue: $title"
            fi
          fi

      # BLO-33585. NOTHING CLOSED THESE ROWS, and for the infra arm that is not
      # untidiness -- it disarms the arm after its first flake.
      #
      # `job.status != 'success' && env.ZERO_DATA != '1'` is true for any
      # non-verdict bad end, and those are third-party-network steps: ipify in
      # the vantage receipt, actions/checkout, the ghcr login, upload-artifact.
      # The cron fires 96x/day on hosted runners, so a blip inside the first
      # few days is close to certain. Once one files `[amt-probe][infra] ...`, the exact
      # title dedup above routes every LATER detector death to `gh issue
      # comment` on that stale row -- so a persistent death (ghcr token expiry,
      # runner-image change) shows up as another comment on a weeks-old row
      # that reads as known-flaky, and a stopped detector is indistinguishable
      # from a healthy relay. That is this issue's own failure mode, re-entering
      # through the arm added to prevent it.
      #
      # A green scheduled run resolves BOTH diagnoses at once and is the only
      # thing that can: data arrived, so the relay is forwarding; a verdict was
      # reached, so the detector ran. Closing restores "the row count tracks
      # FAULTS and not minutes" for the infra arm too, and makes a newly
      # CREATED row the signal again rather than a comment nobody is subscribed
      # to. It also retires the asymmetry that the infra body ends with "Fix the
      # run, then close this row" while the zero-data body has no equivalent.
      #
      # SCHEDULE-ONLY, matching the arms that open these rows. A dispatch may
      # target a different (S,G) or the .99 positive control, and closing a
      # production row off a control run is the silent direction of wrong.
      #
      # `success()` is false if ANY earlier step failed, including the
      # always()-gated upload -- so a partial run never clears a row.
      - name: Clear probe failure rows
        if: ${{ success() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE: ${{ inputs.source || '69.25.95.192' }}
          GROUP: ${{ inputs.group || '232.1.1.60' }}
        run: |
          set -euo pipefail
          # Titles must stay byte-identical to the two built above, or this
          # clears nothing and says so only by printing clear=absent forever.
          for title in \
            "[amt-probe] relay not forwarding to public gateways ($SOURCE,$GROUP)" \
            "[amt-probe][infra] detector failed before a verdict ($SOURCE,$GROUP)"; do
            # Same `|| true` as the routing lookup: a gh failure here must not
            # abort the loop, or one flaky list call leaves the other row open.
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                  --json number,title \
                  | jq -r --arg t "$title" '[.[]|select(.title == $t)]|.[0].number // empty' || true)
            if [ -z "$n" ]; then
              echo "clear=absent title=$title"
            elif gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                   --comment "Recovered at $(date -u +%FT%TZ): a scheduled public-vantage probe reached a verdict and received data. Run: $RUN_URL"; then
              echo "clear=closed issue=$n"
            else
              echo "::error::clearing failed: could not close issue #$n ($title)"
            fi
          done

  # BLO-33457. Tunnel-STATE occupancy ramp: how many concurrent AMT tunnels can
  # the linux relay hold in its tunnel table? This is the MX301-M leg of
  # BLO-20175's sizing model, which is a STATE claim (tunnel-limit 16,384), not
  # the throughput claim BLO-26574 measures.
  #
  # Target is 69.25.95.128:2268 = Service/blockcastd-amt-relay-linux
  # (LoadBalancer, selector app.kubernetes.io/name=amt-relay-linux), verified
  # 2026-09-12. The OTHER relay -- Service/blockcastd-amt-relay, the gw-* one
  # whose job="production-amt-relay" reports amt_relay_tunnel_limit=0 -- is
  # ClusterIP-only and has no public 2268, so a public-vantage ramp cannot
  # accidentally measure it.
  #
  # THE WITNESS IS RECEIVER-SIDE, and that is a correction, not a preference.
  # The AC originally wanted amt_relay_active_tunnels{job="production-amt-relay-linux"}
  # corroborating each step. That gauge is DEAD on both production relays
  # (linux: never non-zero in 30d; juniper: zero variance in 30d, pinned at 1 --
  # BLO-33457). A ramp joined against it reports 0 occupancy at every N, which
  # reads as a relay defect rather than a dead dial. So the witness is
  # `alive` from the client: how many of N reached Active and sustained it past
  # a keep-alive interval. Its positive control is in-tree
  # (each_deliberate_failure_mode_reduces_the_alive_count).
  tunnels-ramp:
    if: ${{ inputs.mode == 'tunnels-ramp' }}
    runs-on: ubuntu-latest
    env:
      RELAY: ${{ inputs.relay || '69.25.95.128' }}
      SOURCE: ${{ inputs.source || '69.25.95.192' }}
      GROUP: ${{ inputs.group || '232.1.1.60' }}
      # Must MATCH the declared input default. It read
      # `...,1024,4096,8192,10000` -- the pre-ruling list -- so a dispatch that
      # supplied ramp_steps as an empty string (REST does; the UI cannot) would
      # silently select the four steps the CTO withheld, via the one path that
      # skips the input default entirely.
      STEPS: ${{ inputs.ramp_steps || '1,8,64,256,1024' }}
      HOLD: ${{ inputs.hold || '25' }}
      KEEPALIVE: ${{ inputs.keepalive || '10' }}
      # Raised inside the container for every docker run below. Declared once so
      # the value enforced against max N cannot drift from the value applied.
      CONTAINER_NOFILE: '1048576'
      # Instrument ceiling, not a relay limit: ~10 KB/tunnel measured to N=10000
      # in one process (tunnels_mode_scales_to_512_concurrent doc comment).
      # Above this the RIG is unvalidated, so a knee there is unattributable.
      MAX_SUPPORTED_N: '10000'
    steps:
      - name: Vantage receipt
        run: |
          echo "utc=$(date -u +%FT%TZ)"
          echo "public_ip=$(curl -fsS https://api.ipify.org)"
          echo "target=$RELAY:2268 sg=($SOURCE,$GROUP) steps=$STEPS"

      # THE STEP LIST IS A CONTRACT AND IT WAS NEVER CHECKED.
      #
      # Everything downstream assumes ascending order. The ramp stops at the
      # first step that establishes nothing, and the verdict reads the run of
      # fully-alive steps as a prefix. Fed `1024,8` those two disagree with each
      # other and both report confidently: the ramp could stop below the
      # configured cap, or the verdict could name a knee above an N that had
      # already failed. Neither shows up as an error -- the numbers just mean
      # something other than what they say.
      - name: Validate ramp steps
        run: |
          steps=$(echo "$STEPS" | tr ',' ' ')
          [ -n "$(echo "$steps" | tr -d ' ')" ] || { echo "::error::ramp_steps is empty"; exit 1; }
          prev=0
          for n in $steps; do
            case "$n" in
              ''|*[!0-9]*) echo "::error::ramp step '$n' is not a non-negative integer"; exit 1 ;;
            esac
            [ "$n" -gt 0 ] || { echo "::error::ramp step '$n' must be > 0"; exit 1; }
            if [ "$n" -le "$prev" ]; then
              echo "::error::ramp steps must be STRICTLY ASCENDING ($n follows $prev). The stop rule and the verdict both read the list in order; unsorted input makes both wrong without failing."
              exit 1
            fi
            if [ "$n" -gt "$MAX_SUPPORTED_N" ]; then
              echo "::error::ramp step $n exceeds MAX_SUPPORTED_N=$MAX_SUPPORTED_N -- the rig is only validated to that N, so a knee above it could not be attributed to the relay"
              exit 1
            fi
            prev=$n
          done
          echo "steps_validated=$steps"

      # INSTRUMENT CEILINGS, MEASURED IMMEDIATELY BEFORE THE RAMP.
      #
      # Each of these would present as a relay-side state knee if it bound
      # first, which is the specific way this measurement gets silently wrong:
      # the ramp would report a ceiling that is really the runner's.
      #
      # Every ceiling below is either ENFORCED against max N or explicitly
      # labelled an OBSERVATION with its failure signature named. Recording a
      # number and then not comparing it is the worst of both: it reads as a
      # guard in the log and guards nothing.
      #
      #   ENFORCED (local runner only; ss cannot establish upstream NAT headroom)
      #     port range  -- the relay keys tunnels by source (IP, port), so N
      #                    tunnels need N distinct source ports. We subtract
      #                    ports already held by UDP sockets immediately before
      #                    the ramp, plus ip_local_reserved_ports. This is only
      #                    local bind headroom; ss cannot establish upstream
      #                    NAT capacity.
      #     nofile      -- one socket per tunnel. The RUNNER's soft default is
      #                    1024, but the client runs in a container with
      #                    --ulimit nofile=$CONTAINER_NOFILE, so the container
      #                    value is the binder and is what gets compared. The
      #                    runner's own limit is recorded as context only.
      #     conntrack   -- this runner's conntrack table; N flows need N entries.
      #                    We subtract current occupancy from the table maximum.
      #                    It is local evidence only, not an upstream-NAT claim.
      #                    If either value is unreadable, the ramp fails closed
      #                    instead of producing a non-attributable ceiling.
      #
      #   OBSERVATIONS (recorded, NOT enforced -- no defensible per-tunnel
      #   constant to compare against, so a threshold here would be invented)
      #     nproc / mem -- these do not produce a clean shortfall. CPU
      #                    starvation shows up as establishment TIMEOUTS
      #                    (establish_errors, "timed out ... Discovering") and
      #                    memory pressure as an OOM-killed container (step
      #                    exit 137, established=0). Both are distinguishable
      #                    from a relay knee in the artifact IF you look: a
      #                    relay-side ceiling refuses new tunnels while the
      #                    established ones stay alive, whereas a host-side one
      #                    degrades the whole step. Read establish_errors and
      #                    not_alive before attributing any knee.
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag pins by construction; this ASSERTS it. A receipt that is recorded
      # and never compared is the same record-but-don't-enforce shape as the ramp
      # contract and the host ceilings -- it reads as a guard in the artifact and
      # guards nothing. Two lines, and it also catches the one case the tag alone
      # cannot: a build that published under this sha with a different revision
      # label.
      - name: Image receipt
        run: |
          docker pull -q $IMAGE || docker build -q -t $IMAGE \
            --label org.opencontainers.image.revision=${{ github.sha }} .
          {
            echo "image_digest=$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}local-build{{end}}' $IMAGE)"
            echo "client_commit=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' $IMAGE)"
            echo "workflow_sha=${{ github.sha }}"
          } | tee image-receipt.txt
          cc=$(sed -n 's/^client_commit=//p' image-receipt.txt)
          [ "$cc" = "${{ github.sha }}" ] || {
            echo "::error::image revision ($cc) != checkout (${{ github.sha }}) -- the client under test is not the client that would run"; exit 1; }

      # BASELINE OCCUPANCY, before the ramp adds anything.
      #
      # The withheld cap steps rested on "the linux relay has served zero tunnels
      # for a week, so there is no live subscriber to displace". That read
      # amt_relay_active_tunnels=0 as a fact about the relay when it is a fact
      # about the gauge -- the same gauge a two-tunnel control had already shown
      # stays flat at 0 while two tunnels were held. This records what the relay
      # says about ITSELF instead, before the ramp perturbs it. Non-fatal: it is
      # evidence for sizing the NEXT run, not a gate on this one.
      - name: Baseline relay occupancy (_astats, pre-ramp)
        run: |
          curl -fsS -m 5 "http://$RELAY:8080/_astats" | tee astats-baseline.json || \
            echo "::warning::_astats unreachable from this public vantage -- baseline unknown, and the candidate occupancy instrument cannot be qualified from here"

      # POSITIVE CONTROL, and it gates the ramp.
      #
      # BLO-20175's liveness AC exists because a relay that answers NOTHING
      # produces a clean-looking sweep: 0 tunnels, 0 drops, no stop rule ever
      # trips, and the ramp reports "no knee through N=10000" -- i.e. maximal
      # capacity -- for a relay that established nothing. An idle (S,G) is
      # deliberate here (the witness is tunnel-table occupancy, not data
      # receipt), but "idle" must not be allowed to shade into "the relay
      # ignores this tuple". One tunnel must come up first, or the ramp is void.
      - name: N=1 positive control (a ramp on a non-establishing tuple is void)
        run: |
          set +e
          docker run --rm --network host \
            --ulimit "nofile=$CONTAINER_NOFILE:$CONTAINER_NOFILE" \
            $IMAGE \
            --no-driad --relay "$RELAY" --source "$SOURCE" --group "$GROUP" \
            --tunnels 1 --keepalive "$KEEPALIVE" --hold "$HOLD" --json \
            >control.json 2>control.log
          status=$?
          set -e
          echo "control_exit=$status"; cat control.json || true
          alive=$(jq -r '.alive // 0' control.json 2>/dev/null || echo 0)
          if [ "$alive" != "1" ]; then
            echo "::error::N=1 control did not establish+survive (alive=$alive). Ramp aborted: a sweep from here would report a false ceiling."
            cat control.log || true
            exit 1
          fi

      # INSTRUMENT CEILINGS, MEASURED IMMEDIATELY BEFORE THE RAMP.
      #
      # Each of these would present as a relay-side state knee if it bound
      # first, which is the specific way this measurement gets silently wrong:
      # the ramp would report a ceiling that is really the runner's.
      #
      # Every ceiling below is either ENFORCED against max N or explicitly
      # labelled an OBSERVATION with its failure signature named. Recording a
      # number and then not comparing it is the worst of both: it reads as a
      # guard in the log and guards nothing.
      #
      #   ENFORCED (local runner only; ss cannot establish upstream NAT headroom)
      #     port range  -- the relay keys tunnels by source (IP, port), so N
      #                    tunnels need N distinct source ports. We subtract
      #                    ports already held by UDP sockets immediately before
      #                    the ramp, plus ip_local_reserved_ports. This is only
      #                    local bind headroom; ss cannot establish upstream
      #                    NAT capacity.
      #     nofile      -- one socket per tunnel. The RUNNER's soft default is
      #                    1024, but the client runs in a container with
      #                    --ulimit nofile=$CONTAINER_NOFILE, so the container
      #                    value is the binder and is what gets compared. The
      #                    runner's own limit is recorded as context only.
      #     conntrack   -- this runner's conntrack table; N flows need N entries.
      #                    We subtract current occupancy from the table maximum.
      #                    It is local evidence only, not an upstream-NAT claim.
      #                    If either value is unreadable, the ramp fails closed
      #                    instead of producing a non-attributable ceiling.
      #
      #   OBSERVATIONS (recorded, NOT enforced -- no defensible per-tunnel
      #   constant to compare against, so a threshold here would be invented)
      #     nproc / mem -- these do not produce a clean shortfall. CPU
      #                    starvation shows up as establishment TIMEOUTS
      #                    (establish_errors, "timed out ... Discovering") and
      #                    memory pressure as an OOM-killed container (step
      #                    exit 137, established=0). Both are distinguishable
      #                    from a relay knee in the artifact IF you look: a
      #                    relay-side ceiling refuses new tunnels while the
      #                    established ones stay alive, whereas a host-side one
      #                    degrades the whole step. Read establish_errors and
      #                    not_alive before attributing any knee.
      - name: Host ceilings (recorded, then enforced or labelled)
        run: |
          {
            echo "runner_nofile_soft=$(ulimit -Sn)"
            echo "runner_nofile_hard=$(ulimit -Hn)"
            echo "container_nofile=$CONTAINER_NOFILE"
            echo "ip_local_port_range=$(cat /proc/sys/net/ipv4/ip_local_port_range)"
            lo=$(awk '{print $1}' /proc/sys/net/ipv4/ip_local_port_range)
            hi=$(awk '{print $2}' /proc/sys/net/ipv4/ip_local_port_range)
            echo "source_ports_total=$((hi-lo+1))"
            reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports 2>/dev/null || true)
            reserved_info=$(awk -v lo="$lo" -v hi="$hi" -v raw="$reserved" '
              BEGIN {
                count = 0; bad = 0
                if (raw == "") { print "0 0"; exit }
                n = split(raw, ranges, ",")
                for (i = 1; i <= n; i++) {
                  token = ranges[i]
                  if (token !~ /^[0-9]+(-[0-9]+)?$/) { bad++; continue }
                  split(token, bounds, "-")
                  first = bounds[1] + 0
                  last = (bounds[2] == "" ? first : bounds[2] + 0)
                  if (last < first) { bad++; continue }
                  if (first < lo) first = lo
                  if (last > hi) last = hi
                  if (first <= last) {
                    # The kernel normally emits sorted, merged ranges, but the
                    # contract does not require that. Deduplicate overlaps so
                    # reservations cannot be over-counted and turn a valid
                    # headroom reading into a false fail-closed result.
                    for (port = first; port <= last; port++) {
                      if (!seen[port]++) count++
                    }
                  }
                }
                printf "%d %d\n", count, bad
              }')
            echo "ip_local_reserved_ports=${reserved:-none}"
            echo "source_ports_reserved=${reserved_info%% *}"
            echo "source_ports_reserved_parse_errors=${reserved_info#* }"
            if command -v ss >/dev/null 2>&1 && ss -H -u -a -n >udp-sockets.txt 2>/dev/null; then
              awk -v lo="$lo" -v hi="$hi" '
                {
                  if (NF < 4) { bad++; next }
                  raw = $4
                  sub(/^.*:/, "", raw)
                  if (raw !~ /^[0-9]+$/) { bad++; next }
                  port = raw + 0
                  if (port >= lo && port <= hi && !seen[port]++) used++
                }
                END { printf "source_ports_used=%d\nsource_ports_parse_errors=%d\n", used + 0, bad + 0 }
              ' udp-sockets.txt
            else
              echo "source_ports_used=unavailable"
              echo "source_ports_parse_errors=unavailable"
            fi
            echo "nf_conntrack_max=$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null || echo unavailable)"
            echo "nf_conntrack_used=$(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || echo unavailable)"
            echo "nproc=$(nproc)                # OBSERVATION"
            echo "mem_total_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)   # OBSERVATION"
          } | tee host-ceilings.txt

          is_uint() { case "$1" in ''|*[!0-9]*) return 1 ;; esac; }
          ports_total=$(sed -n 's/^source_ports_total=//p' host-ceilings.txt)
          ports_reserved=$(sed -n 's/^source_ports_reserved=//p' host-ceilings.txt)
          reserved_bad=$(sed -n 's/^source_ports_reserved_parse_errors=//p' host-ceilings.txt)
          ports_used=$(sed -n 's/^source_ports_used=//p' host-ceilings.txt)
          ports_bad=$(sed -n 's/^source_ports_parse_errors=//p' host-ceilings.txt)
          if ! is_uint "$ports_total" || ! is_uint "$ports_reserved" || \
             ! is_uint "$reserved_bad" || ! is_uint "$ports_used" || \
             ! is_uint "$ports_bad" || [ "$ports_bad" -ne 0 ] || \
             [ "$reserved_bad" -ne 0 ]; then
            echo "::error::could not establish current local UDP source-port occupancy/reservations; the ramp is non-attributable"
            exit 1
          fi
          ports_usable=$((ports_total - ports_reserved))
          ports_available=$((ports_usable - ports_used))
          [ "$ports_usable" -ge 0 ] && [ "$ports_available" -ge 0 ] || {
            echo "::error::local UDP source-port occupancy/reservations exceed the configured range"; exit 1;
          }
          echo "source_ports_usable=$ports_usable" | tee -a host-ceilings.txt
          echo "source_ports_available=$ports_available" | tee -a host-ceilings.txt

          ct=$(sed -n 's/^nf_conntrack_max=//p' host-ceilings.txt)
          ct_used=$(sed -n 's/^nf_conntrack_used=//p' host-ceilings.txt)
          if ! is_uint "$ct" || ! is_uint "$ct_used"; then
            echo "::error::could not establish current local conntrack occupancy; the ramp is non-attributable"
            exit 1
          fi
          ct_available=$((ct - ct_used))
          [ "$ct_available" -ge 0 ] || { echo "::error::local conntrack occupancy exceeds nf_conntrack_max"; exit 1; }
          echo "nf_conntrack_available=$ct_available" | tee -a host-ceilings.txt

          # The largest requested N must fit under every ENFORCED ceiling, or
          # the ramp is measuring this runner. Fail LOUDLY rather than produce
          # a plausible number.
          max_n=$(echo "$STEPS" | tr ',' '\n' | sort -n | tail -1)
          echo "max_requested_n=$max_n" | tee -a host-ceilings.txt
          fail=0

          ports=$(sed -n 's/^source_ports_available=//p' host-ceilings.txt)
          if [ "$max_n" -ge "$ports" ]; then
            echo "::error::max N ($max_n) leaves no local source-port headroom (only $ports currently free) -- this would measure local bind/SNAT behavior, not relay state"
            fail=1
          fi

          # One socket per tunnel plus the process's own handles. Headroom is
          # deliberate: at the cap the shortfall would otherwise land exactly
          # where the knee is expected.
          if [ "$max_n" -ge "$CONTAINER_NOFILE" ]; then
            echo "::error::max N ($max_n) is at or above the container nofile limit ($CONTAINER_NOFILE) -- 'Too many open files' would be recorded as a relay knee"
            fail=1
          fi

          ct=$(sed -n 's/^nf_conntrack_available=//p' host-ceilings.txt)
          if [ "$max_n" -ge "$ct" ]; then
            echo "::error::max N ($max_n) leaves no local conntrack headroom (only $ct currently free) -- local NAT state exhaustion would be recorded as a relay knee"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

      # Per-step UTC start/end. The relay-side join these were originally for is
      # off the table (amt_relay_active_tunnels is dead -- see the job header),
      # but they stay: they are what lets a step be correlated with the relay
      # pod's own CPU/memory series, with LB behaviour, or with anything else
      # measured later. Unrecordable after the fact, cheap now.
      #
      # CANDIDATE OCCUPANCY INSTRUMENT, SAMPLED UNDER QUALIFICATION.
      #
      # The relay serves its own stats as JSON on :8080/_astats, and that
      # surface is NOT the dead gauge. Measured in-cluster 2026-09-12, same pod,
      # seconds apart: _astats "amt.relay.active_tunnels"=29 while the Prometheus
      # exporter's amt_relay_active_tunnels=0. So this one demonstrably returns a
      # positive, which is exactly the property the gauge lacks.
      #
      # It is sampled here as an OBSERVATION and deliberately does NOT gate the
      # step -- enforcing an instrument on the same run that is meant to qualify
      # it is circular, and a 0 here would then void a ramp for the instrument's
      # fault rather than the relay's. Qualification criterion, applied by hand
      # to the artifact afterwards: does peak occupancy TRACK the requested N?
      # If it moves to ~1024 while 1024 tunnels are held, it is qualified and it
      # licenses the withheld cap steps. If it reads 0, it is a seventh dead dial.
      #
      # Both counters are kept because they are DIFFERENT FIELDS and were not
      # equal when measured (relay.active_tunnels=29, interface.amtr.tunnels=47).
      # Which of them tracks N is part of what this run establishes; assuming
      # they are the same number is how a wrong one gets adopted.
      #
      # Public reachability of :8080 is unverified -- the pre-run read was via
      # the LB IP from in-cluster, which kube-proxy may short-circuit. An
      # unreachable endpoint records {} and costs the run nothing.
      - name: Ramp
        run: |
          echo '[]' > ramp-index.json
          for n in $(echo "$STEPS" | tr ',' ' '); do
            t0=$(date -u +%FT%TZ)
            echo "=== N=$n start=$t0 ==="
            set +e
            docker run --rm --network host \
              --ulimit "nofile=$CONTAINER_NOFILE:$CONTAINER_NOFILE" \
              $IMAGE \
              --no-driad --relay "$RELAY" --source "$SOURCE" --group "$GROUP" \
              --tunnels "$n" --keepalive "$KEEPALIVE" --hold "$HOLD" --json \
              >"step-$n.json" 2>"step-$n.log" &
            pid=$!
            # Sample for the whole step rather than at one guessed instant: with
            # establishment time unknown a single sample can land before the
            # tunnels are up and read a false 0.
            : > "astats-$n.ndjson"
            while kill -0 $pid 2>/dev/null; do
              curl -fsS -m 3 "http://$RELAY:8080/_astats" >> "astats-$n.ndjson" 2>/dev/null
              echo >> "astats-$n.ndjson"
              sleep 2
            done
            wait $pid
            rc=$?
            set -e
            t1=$(date -u +%FT%TZ)
            peak_relay=$(jq -s 'map(.ats."amt.relay.active_tunnels"//empty)|max//null' "astats-$n.ndjson" 2>/dev/null || echo null)
            peak_iface=$(jq -s 'map(.ats."amt.interface.amtr.tunnels"//empty)|max//null' "astats-$n.ndjson" 2>/dev/null || echo null)
            echo "N=$n exit=$rc end=$t1 astats_peak_relay_active_tunnels=$peak_relay astats_peak_iface_tunnels=$peak_iface"
            cat "step-$n.json" || true
            jq --argjson n "$n" --arg t0 "$t0" --arg t1 "$t1" --argjson rc "$rc" \
               --argjson pr "${peak_relay:-null}" --argjson pi "${peak_iface:-null}" \
               --slurpfile r "step-$n.json" \
               '. + [{requested:$n, started_utc:$t0, ended_utc:$t1, exit:$rc,
                      astats_peak_relay_active_tunnels:$pr,
                      astats_peak_iface_tunnels:$pi,
                      report:($r[0] // null)}]' \
               ramp-index.json > tmp.json && mv tmp.json ramp-index.json
            # A degraded step IS the measurement -- it is where the knee is --
            # so the loop does not stop on a non-zero exit. It stops only when
            # nothing came up at all, which means every larger N is wasted.
            est=$(jq -r '.established // 0' "step-$n.json" 2>/dev/null || echo 0)
            if [ "$est" = "0" ]; then
              echo "::warning::N=$n established 0 tunnels; stopping the ramp"
              break
            fi
          done
          echo '--- ramp-index.json ---'; jq . ramp-index.json

      # AC 4: a clean completion at the cap is "ceiling >= cap, config-bound",
      # NOT "no state knee". Those are different findings and only one of them
      # is honest about what was and was not shown.
      #
      # `top` is the last step of the LEADING RUN of fully-alive steps, not the
      # largest fully-alive step anywhere in the list. With a degraded step at
      # 256 and a clean one at 1024, `max` would report a ceiling above an N
      # that had already failed. The leading run is the only reading that says
      # "every N up to here held", which is the claim BLO-20175 sizes against.
      - name: Verdict
        run: |
          cap=$(echo "$STEPS" | tr -d '[:blank:]' | tr ',' '\n' | sort -n | tail -1)
          top=$(jq -r '
            (map((.report.alive // -1) == .requested) | index(false)) as $i
            | (if $i == null then . else .[0:$i] end)
            | if length == 0 then 0 else .[-1].requested end' ramp-index.json)
          ran=$(jq -r 'length' ramp-index.json)
          echo "highest_fully_alive_N=$top cap=$cap steps_run=$ran"
          # A shortfall is the RELAY's tunnel table only if its cause says so.
          # This is a POSITIVE test for relay attribution, not a blocklist of
          # host-side symptoms: an error string nobody has seen before must fall
          # through to "not a relay knee", because that is the direction a capex
          # number is safe to be wrong in. (An earlier blocklist spelling of this
          # matched "refused" and so swallowed "relay refused: tunnel table
          # full" -- the negative control below exists to keep that fixed.)
          # Surfacing-without-enforcing is the fourth instance of that pattern in
          # this file; the other three were the ramp contract, the host ceilings,
          # and the image label.
          causes=$(jq -r '.[]|select((.report.alive // -1) != .requested)
            |(((.report.establish_errors // {})|keys[]?),((.report.not_alive // {})|keys[]?))' ramp-index.json)
          n_relay=$(echo "$causes" | grep -cEi 'relay (refused|rejected)|tunnel[ -](table|limit)|no more tunnels' || true)
          n_other=$(echo "$causes" | grep -cvEi 'relay (refused|rejected)|tunnel[ -](table|limit)|no more tunnels' || true)
          [ -z "$causes" ] && n_relay=0 && n_other=0
          # Does any step admit it could not tell N tunnels from one aliased N
          # ways? This gate runs FIRST and supersedes every branch below,
          # including the clean-to-cap one -- a ramp that sails to the cap on a
          # single source address is the WORST case, not the best: it reports a
          # ceiling having established one tunnel. `alive` is a send-side
          # self-report, so nothing downstream of it can notice.
          # `// 1` defaults a report predating the field to ONE distinct
          # source, so an unknown fires this gate rather than passing it:
          # 1 < requested holds for every N > 1. (`// .requested` would read
          # N < N, false, and skip the gate for exactly the legacy reports it
          # exists to catch.)
          aliased=$(jq -r '[.[]|select(((.report.distinct_outer_sources // 1)) < .requested)]|length' ramp-index.json)
          if [ "$aliased" -gt 0 ]; then
            echo "verdict=WITNESS NOT ESTABLISHED ($aliased/$ran steps ran all gateways from ONE outer source address). NOT a ceiling, NOT a knee, and NOT 'no knee': linux-amt as deployed keys tunnel state on the outer ADDRESS alone, so N gateways from one address occupy ONE relay tunnel entry while every one still reads Active and sends keep-alives. An alive of N here is indistinguishable from one tunnel aliased N ways, so this run says nothing about the relay's tunnel table at any N. Do NOT size against this number. Needs distinct source addresses (linux-amt kernel/selftests/amt_capacity.sh) and/or the BLO-33636 keying fix." | tee verdict.txt
          elif [ "$top" -eq "$cap" ]; then
            echo "verdict=ceiling >= $cap, config-bound (NOT 'no state knee': the ramp ended at the configured cap, so no knee was reached or excluded above it)" | tee verdict.txt
          elif [ "$n_relay" -gt 0 ] && [ "$n_other" -eq 0 ]; then
            echo "verdict=knee at N>$top (first degraded step above $top; every shortfall is relay-attributed -- see ramp-index.json)" | tee verdict.txt
          else
            echo "verdict=degraded above N=$top, BINDER NOT ESTABLISHED ($n_other cause(s) not attributed to the relay). NOT a relay knee: a bare transport failure is equally consistent with the relay's tunnel table, public-path loss, and this runner's NAT/source-port or rate limiting. Do NOT size against this number." | tee verdict.txt
          fi
          jq -r '[.[]|select((.report.establish_errors // {}) != {} or (.report.not_alive // {}) != {})
                 |{requested, establish_errors:.report.establish_errors, not_alive:.report.not_alive}]' \
             ramp-index.json | tee -a verdict.txt
          echo "NOTE: control-plane tunnel-table ceiling, not a loaded-state ceiling. Witness is RECEIVER-SIDE (client 'alive'); relay-side amt_relay_active_tunnels is dead and was deliberately not used. Every step report carries the caveat inline." | tee -a verdict.txt
          # Occupancy-instrument QUALIFICATION, reported next to the verdict so
          # the two are read together. This does not corroborate THIS ramp -- an
          # unqualified instrument cannot corroborate anything -- it says whether
          # _astats earned the right to corroborate the NEXT one.
          {
            echo "--- candidate occupancy instrument (_astats :8080), qualification ---"
            # `jq` exits 0 and prints NOTHING on an empty file, so the old
            # `|| echo unreachable` could never fire: an unreachable instrument
            # was rendered as an empty string and read as "no data". Test the
            # file has bytes first -- an instrument that was never read must not
            # be reported in the same shape as one that answered.
            if [ -s astats-baseline.json ]; then
              echo "baseline_pre_ramp=$(jq -c '.ats|{relay:."amt.relay.active_tunnels",iface:."amt.interface.amtr.tunnels",limit:."amt.relay.tunnel_limit"}' astats-baseline.json 2>/dev/null || echo malformed)"
            else
              echo "baseline_pre_ramp=UNREACHABLE (no bytes returned; _astats is in-cluster only and this job runs from the public runner)"
            fi
            jq -r '.[]|"requested=\(.requested) peak_relay_active_tunnels=\(.astats_peak_relay_active_tunnels) peak_iface_tunnels=\(.astats_peak_iface_tunnels) alive=\(.report.alive // "n/a")"' ramp-index.json
            # Three outcomes, not two. A column of nulls means the instrument was
            # NOT SAMPLED -- it is not evidence the dial is dead, and recording it
            # as such would condemn a counter measured live at relay=29/iface=47
            # from in-cluster hours earlier.
            if jq -e '[.[]|.astats_peak_relay_active_tunnels,.astats_peak_iface_tunnels]|all(.==null)' ramp-index.json >/dev/null; then
              echo "qualification=NOT SAMPLED -- every peak is null, i.e. no reading was taken. This is NOT the 'dead dial' verdict and must not be recorded as one: it says nothing about _astats, only that this vantage could not reach it. Re-run with the sampler in-cluster."
            else
              echo "qualification=QUALIFIED if a peak column rises with requested N; DEAD DIAL if it stays flat at a value (that is the amt_relay_active_tunnels failure, and it would be the seventh). Read the two peak columns separately: they were NOT equal pre-ramp (relay=29, iface=47), so whichever tracks N is the occupancy counter and the other is something else."
            fi
          } | tee -a verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-tunnels-ramp
          path: |
            host-ceilings.txt
            image-receipt.txt
            astats-baseline.json
            astats-*.ndjson
            control.json
            control.log
            ramp-index.json
            verdict.txt
            step-*.json
            step-*.log
            report*.json
            verbose*.log

  # BLO-33636 AC 2, as AMENDED 2026-09-30 by its author (PlatformSREEngineer).
  # The clause this implements replaces `each tunnel's loss_ratio < 0.002`.
  #
  # Why that one was retired -- it is the same defect this job must not repeat.
  # It was an ABSOLUTE threshold sitting on a baseline the rig cannot hold
  # constant: the runner's public IP is assigned per run, and three consecutive
  # runs on 2026-09-28 against one relay, one stream and one client build
  # measured per-tunnel loss of 0.000365 / 0.00752 / 0.01101 on three different
  # vantages. A 30x spread with every controlled variable identical. So the
  # clause did not measure the relay; it measured which Azure egress the runner
  # drew, and it redded a relay that those same runs had just shown correct.
  #
  # What it was REACHING for is the cost of fan-out: does asking the relay for N
  # tunnels make the stream lossier than asking it for 1? That is a DIFFERENCE.
  #
  #   signal = loss(N) - mean(loss(1_a), loss(1_b))    the fan-out cost
  #   noise  = |loss(1_a) - loss(1_b)|                 what the paths did on
  #                                                    their own, over that
  #                                                    same interval
  #
  # WHY THE LEGS ARE CONCURRENT AND CROSS-VANTAGE. The sequential same-vantage
  # bracket (legs 1, N, 1 on ONE runner) that stood here from 2026-09-29 is
  # WITHDRAWN -- withdrawn, not re-tuned, because it was structurally invalid
  # rather than merely noisy.
  #
  # It asked the control leg to do two things that cannot both hold ON THIS
  # DEFECT: share the network path with the treatment leg, AND be unaffected by
  # it. "Shares the path" is implemented as "shares the source address", and the
  # relay keys tunnel state on the source address -- so the control was coupled
  # to the treatment through the exact mechanism under test. A control affected
  # by the treatment is not a control, at any threshold.
  #
  # Measured, run 36613247340, one vantage 20.102.103.115:
  #   leg 1 (N=1) 66989 | leg 2 (N=3) 67531 / 0 / 67493 | leg 3 (N=1) 0
  # Leg 3 is a plain N=1 join, identical to leg 1, same address, two minutes
  # later. It received NOTHING. That is a dead instrument, not an unlucky floor.
  # (Two mechanisms predict it -- relay slot retention, and the mroute syncer's
  # address-keyed gatewayKey -- and the withdrawal does not depend on which.)
  #
  # There is NO same-vantage concurrent variant. Two simultaneous N=1 joins from
  # one address ARE the collision under test. Shared path and independent source
  # address are mutually exclusive here, which is why the clause as originally
  # written had no valid implementation at all.
  #
  # Cross-vantage is licensed by MEASUREMENT, not by convenience. The path term
  # it appears to give up was measured as COMMON to observers ONCE: two
  # concurrent runs on different egress IPs agreed to within ~2.4%
  # (36612884351 0.00055490 vs 36612890738 0.00056847 -- delta 1.36e-5, 147x
  # under THRESH), which is what suggested the dominant loss term is upstream
  # of the vantage and cancels in a cross-vantage difference just as it does in
  # a same-vantage one. That is the SINGLE FAVOURABLE OBSERVATION, and the one
  # dispatch of this design that produced a floor did not reproduce it: run
  # 36664230865 read a cross-vantage floor of 2.02e-3 (N=1 legs 5.031e-3 /
  # 3.011e-3) against a within-vantage spread of 7.6e-6 in the same minute --
  # ~265x apart. Run 36664238282 produced no floor (leg 1 null; its 2.577e-3 is
  # leg 3 alone), so it neither reproduces nor contradicts either reading. One
  # agreement against one wide floor settles nothing, and the licence is a
  # hypothesis every run now tests (within_vantage_spread beside the floor)
  # rather than a settled property.
  #
  # The 780 s quiet-gap variant was rejected for a structural reason, not a cost
  # one: it is calibrated against an undocumented 260 s / 780 s retention window
  # that is a property of the PRE-FIX relay. An instrument whose validity rests
  # on the broken relay's timer would have to be re-established against the
  # fixed relay before it could certify it. Concurrency has no such coupling.
  #
  # VOID is load-bearing and is why this is not simply a delta threshold. A path
  # that drifts by more than the threshold cannot answer a question posed at
  # that threshold, in EITHER direction -- so a clean-looking signal over a
  # drifting floor is not a pass, it is an unanswerable run. Without the paired
  # floor the delta is just another unvalidated constant and would rot exactly
  # as the absolute one did: a delta instrument with no noise floor licenses the
  # INSTRUMENT, never the THRESHOLD.
  #
  # TWO GUARDS ARE NEW AND THEY ARE WHAT MAKE THIS DESIGN THE DESIGN:
  #
  #   DISTINCT VANTAGES. If two legs drew the same egress address they are the
  #     collision, not a control pair -- the very thing the withdrawal is about,
  #     silently rebuilt. GitHub does not promise distinct egress per runner, so
  #     this is checked and not assumed. VOID.
  #
  #   OVERLAPPING WINDOWS. The floor is only a floor if it is contemporaneous
  #     with the signal; three legs that ran one after another are the withdrawn
  #     design wearing this one's label. Zero three-way overlap is VOID. The
  #     overlap FRACTION is reported and DELIBERATELY NOT thresholded: the
  #     ruling's floor-characterization condition says that constant comes from
  #     >= 5 runs of data, so guessing one here would be the retired absolute
  #     clause's defect a third time. Same discipline as the 0.9 in_sequence
  #     bar, which says on its own line that it is set from one observation.
  #     The start/end stamps come from three independent runner clocks, so
  #     the fraction also carries inter-runner skew: immaterial to the
  #     overlap > 0 test, but present in any fraction harvested from runs.
  #
  # Stated residual, on the record rather than discovered later: this assumes
  # path loss is roughly stationary across the three legs and common across the
  # three vantages. The two N=1 legs are what make that falsifiable instead of
  # implicit -- they cannot prove it, but they refuse the run when it visibly
  # fails.
  #
  # SCOPE. This job does not re-decide demultiplexing. `tunnels_receiving=N/N`
  # is oneshot's verdict (exit 91 VOID / 93 knee) and is the other half of AC 2;
  # a leg here that fails to establish fan-out is reported VOID and routed there
  # rather than being diagnosed twice, in two places, with two chances to drift.

  # Validation lives in its own job, ahead of the legs, for a reason that is not
  # tidiness. Run inside the matrix it would fire three times, and -- worse --
  # the verdict job cannot tell "the dispatch was unusable" from "every leg
  # VOIDed": both arrive as an absent artifact. VOID is a claim about the path,
  # exit 92 is a claim about the dispatch, and collapsing them would let a typo
  # read as a relay measurement. Failing once, before any leg is paid for, keeps
  # them distinguishable.
  loss-delta-preflight:
    if: ${{ inputs.mode == 'loss-delta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TIMEOUT: ${{ inputs.timeout || '30' }}
      PACKETS: ${{ inputs.packet_count || '3' }}
      TUNNELS: ${{ inputs.tunnels || '3' }}
    steps:
      - name: reject unusable dispatch inputs
        run: |
          # From the AC, NOT a dispatch input: a caller must not be able to
          # declare the threshold that decides their own result. Same reasoning
          # as DISTINCT_SOURCE_IPS in the probe job. It is repeated in the
          # verdict job, which is where it is actually applied; the copy here
          # exists only to derive the sample floor, and the test asserts both.
          THRESH=0.002

          MAX_TUNNELS=256
          case "$TUNNELS" in ''|*[!0-9]*)
            echo "::error::tunnels must be an integer in 2..$MAX_TUNNELS, got '$TUNNELS'"; exit 92 ;;
          esac
          # The floor is 2, not 1. At N=1 the treatment leg IS a floor leg, so
          # signal is 0 by construction and the run would report PASS having
          # measured nothing -- a vacuous green, which is worse than a refusal.
          if [ "$TUNNELS" -lt 2 ] || [ "$TUNNELS" -gt "$MAX_TUNNELS" ]; then
            echo "::error::tunnels must be an integer in 2..$MAX_TUNNELS, got '$TUNNELS' (N=1 makes the treatment leg a floor leg: signal is 0 by construction)"; exit 92
          fi
          case "$TIMEOUT" in ''|*[!0-9]*)
            echo "::error::timeout must be an integer, got '$TIMEOUT'"; exit 92 ;;
          esac
          # The legs are CONCURRENT, so the budget is 1x timeout, not the 3x it
          # was under the withdrawn sequential bracket. Kept as a check anyway:
          # an EXCEEDED job timeout CANCELS the job (measured, see the probe
          # job's note), and a cancelled leg emits no artifact -- which the
          # verdict job can only report as a missing measurement.
          if [ "$TIMEOUT" -gt 780 ]; then
            echo "::error::timeout=${TIMEOUT}s exceeds the 780s budget under the leg job's 15-minute cap (legs are concurrent, so this is 1x timeout plus image pull and container startup, not 3x)"; exit 92
          fi
          # packet_count is SHARED with oneshot, whose default of 3 is right for
          # detection and wrong here: the per-receipt SAMPLE FLOOR needs
          # (received + 1) x THRESH > 1, so the least usable received is
          # floor(1 / THRESH) = 500. received <= packet_count always (packet_count
          # also counts duplicate and behind-the-mark arrivals), so a packet_count
          # below that cannot clear it: refuse before paying for three legs that
          # can only VOID. The runtime floor STAYS -- received can still fall short
          # of a packet_count that clears this (deadline, reordering).
          case "$PACKETS" in ''|*[!0-9]*)
            echo "::error::packet_count must be an integer, got '$PACKETS'"; exit 92 ;;
          esac
          MIN_PACKETS=$(jq -n --argjson t "$THRESH" '1 / $t | floor')
          if [ "$PACKETS" -lt "$MIN_PACKETS" ]; then
            echo "::error::packet_count=$PACKETS is below the sample floor of $MIN_PACKETS: a receipt counts only if (received + 1) x THRESH > 1, i.e. received >= $MIN_PACKETS at THRESH=$THRESH, and received <= packet_count, so all three legs would VOID as 'sample too short'. Dispatch comfortably above $MIN_PACKETS -- late arrivals count in packet_count but not in received."; exit 92
          fi
          echo "preflight_ok tunnels=$TUNNELS timeout=$TIMEOUT packet_count=$PACKETS threshold=$THRESH"

  # THE THREE LEGS. A matrix, so each leg is a SEPARATE RUNNER and therefore a
  # separate public IP -- which is the whole point of the design, and the exact
  # opposite of what the withdrawn same-job bracket needed. Matrix legs start
  # together, so the three joins overlap in wall-clock time; the verdict job
  # MEASURES that overlap rather than assuming it.
  #
  # Leg indices 1/2/3 are floor / treatment / floor, kept in that order so the
  # verdict arithmetic reads $m[0], $m[1], $m[2] exactly as it did. The order is
  # now positional bookkeeping only -- concurrent legs have no sequence to
  # bracket, and the bracketing the old order bought is replaced by the overlap
  # guard.
  loss-delta:
    if: ${{ inputs.mode == 'loss-delta' }}
    needs: loss-delta-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A dead leg must NOT cancel its siblings. The surviving legs and their
      # vantages are what let the verdict say WHY the run is void, and a
      # cancelled sibling emits no artifact to say it with.
      fail-fast: false
      matrix:
        include:
          - leg: 1
            n: 1
          - leg: 2
            n: ${{ inputs.tunnels || '3' }}
          - leg: 3
            n: 1
    permissions:
      contents: read
      packages: read
    env:
      RELAY: ${{ inputs.relay || '69.25.95.128' }}
      SOURCE: ${{ inputs.source || '69.25.95.192' }}
      GROUP: ${{ inputs.group || '232.1.1.60' }}
      TIMEOUT: ${{ inputs.timeout || '30' }}
      PACKETS: ${{ inputs.packet_count || '3' }}
      LEG: ${{ matrix.leg }}
      N: ${{ matrix.n }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: leg (N concurrent joins from this runner's own vantage)
        run: |
          # THIS STEP NEVER FAILS ON A MEASUREMENT OUTCOME. It always writes
          # leg-$LEG.json, with `mean` possibly null or "short", and exits 0.
          # The verdict is one job's job, in one place. A leg that exited
          # nonzero here would skip its own artifact upload and arrive at the
          # verdict as silence -- indistinguishable from a runner that never
          # started, which is a different fact with a different follow-up.
          docker pull -q $IMAGE || docker build -q -t $IMAGE \
            --label org.opencontainers.image.revision=${{ github.sha }} .
          echo "image_digest=$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}local-build{{end}}' $IMAGE)"
          echo "client_commit=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' $IMAGE)"

          # The vantage is the variable this design VARIES rather than holds,
          # so it is recorded per leg and the verdict refuses a collision. One
          # curl, this leg, this runner.
          ip=$(curl -fsS https://api.ipify.org || echo unavailable)
          echo "leg${LEG}_public_ip=$ip n=$N"

          # Wall-clock window. The verdict intersects the three of them: a floor
          # that did not run WHILE the signal ran is not a floor, it is the
          # withdrawn sequential design with a matrix in front of it.
          start=$(date -u +%s)
          pids=""
          # amt-verify exits 1 on `outcome: timeout`, the NORMAL end of a
          # bounded sample (BLO-26574, CTO ruling item 5), so the exit code is
          # not the verdict here any more than it is in the probe job. The
          # receipt is. Suspend errexit across the reap for that reason.
          set +e
          for i in $(seq 1 "$N"); do
            docker run --rm --network host $IMAGE \
              --no-driad --relay "$RELAY" --source "$SOURCE" --group "$GROUP" \
              --timeout "$TIMEOUT" --packet-count "$PACKETS" --json --verbose \
              >"leg$LEG-report-$i.json" 2>"leg$LEG-verbose-$i.log" &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p"; done
          set -e
          end=$(date -u +%s)

          # Per-receipt telemetry BEFORE the mean, so a VOID names the leg and
          # the field that caused it rather than reporting a bare null.
          for i in $(seq 1 "$N"); do
            jq -rc --argjson l "$LEG" --argjson i "$i" \
              '{leg:$l,tunnel:$i,source,group,packet_count,received:.mmtp.received,
                in_sequence:.mmtp.in_sequence,tracks:.mmtp.tracks,
                implausible:.mmtp.implausible,loss_ratio:.mmtp.loss_ratio}' \
              "leg$LEG-report-$i.json" 2>/dev/null \
              || echo "{\"leg\":$LEG,\"tunnel\":$i,\"receipt\":\"missing-or-unparseable\"}"
          done

          # Fail CLOSED on every field the mean depends on, and on the COUNT.
          # A mean taken over the survivors of a partly-failed leg would
          # silently be a mean over a different N than the leg asked for --
          # and N is the variable under test, so that is not a degraded
          # measurement, it is a measurement of something else wearing this
          # one's label. `length == $n` is the guard that refuses it.
          #
          # loss_ratio is amt-verify's own field and is byte-identical to the
          # AC's `gaps/(gaps+received)` -- verified on run 36474867098's three
          # receipts, including the non-zero one (25/68487 -> 0.0003650327799
          # by both). Read it rather than recomputing it, but assert it is a
          # number: an absent field would otherwise arrive as null and a
          # null mean would read as 0.
          #
          # loss_ratio counts SEQUENCE CONTINUITY, not delivery, so it reads
          # HIGH under reordering or duplication -- a direction no threshold
          # on it can detect, because the inflated value is a perfectly
          # ordinary float. Measured on run 36613263318 (BLO-33636): a leg
          # reported loss_ratio 0.3242 with implausible=0 while receiving
          # 67248 packets, the MOST of its round (peers 66920/66923). A third
          # of the stream was plainly not lost; its sequence space was read
          # twice. in_sequence is the field that says so.
          #
          # in_sequence counts arrivals exactly one past their track's previous
          # number, so a track's FIRST arrival is never in it (amt-verify
          # SeqTracker::observe): a perfectly clean stream has in_sequence ==
          # packet_count - tracks EXACTLY. The bar is 0.9 of that, not of
          # packet_count -- against packet_count it was unsatisfiable below
          # ~10 x tracks packets, and PACKETS defaults to 3, so every default
          # dispatch VOIDed (Ally review, PR #49). The corrupt leg above sat at
          # 0.507 (in_sequence 34115 of 67248 - 9 tracks). The 15 healthy
          # receipts taken that day read 0.996..1.000 of packet_count; against
          # packet_count - tracks, the smaller basis, they can only read
          # higher. 0.9 sits between those, but note it is set from ONE
          # corrupt observation: widen it only on more.
          # The bar also caps what this job can report as FAIL: one track with
          # G gap runs has in_sequence = packet_count - 1 - G against
          # 0.9 x (packet_count - 1), so G > 0.1 x (packet_count - 1) is refused
          # as VOID. The cap is on gap RUNS, not lost packets: isolated
          # single-packet loss hits it near 9% loss_ratio, bursty loss (mean
          # bursts of 5-21 in BLO-33456) clears the bar at far higher loss.
          # Frequent scattered loss reads VOID, not FAIL, by design.
          # tracks is asserted numeric like the other two; its `// 0` is the
          # STRICTEST fallback (it restores the packet_count bar), so that
          # conjunct alone refuses an absent tracks. And tracks <= received:
          # every track's first arrival is in received (SeqTracker::observe),
          # so a genuine receipt cannot break it, and without it a corrupt
          # tracks drives the bar negative and waves any in_sequence through.
          # Bounded by received rather than packet_count because that is the
          # invariant amt-verify actually holds, and it leaves the
          # packet_count > 0 guard its own witness.
          #
          # SAMPLE FLOOR. A clean sample of 3 packets has in_sequence 2, which
          # clears the bar -- but it cannot measure loss at THRESH. One lost
          # packet reads as 1/(received + 1) (loss_ratio = gaps / (gaps +
          # received)), so at 3 packets it is 0.25 -- and a lossy short leg
          # fails the bar besides, since a gap-ending arrival is not
          # in-sequence. Without a floor a short run returns PASS or VOID and
          # never FAIL. The floor is derived from THRESH, not chosen: a receipt
          # counts only if ONE lost packet would read BELOW THRESH, i.e.
          # (received + 1) x THRESH > 1 -- received >= 500 at 0.002.
          # received, not packet_count - tracks: received is the ratio's own
          # denominator term, so this is its resolution exactly. packet_count
          # also counts duplicate and behind-the-mark arrivals the ratio never
          # sees -- 20920 of 67248 on the reordering receipt above -- so it
          # can claim a resolution the ratio does not have. Arithmetic rather
          # than `>=` so a non-numeric received errors (jq orders strings
          # above every number) instead of passing. It is checked only once
          # every other guard has passed, so the leg reports "short" rather
          # than null, and the VOID names that cause rather than a bare null.
          #
          # The in_sequence bar is kept LAST in the conjunction on purpose.
          # jq's `and` short-circuits, so a guard placed earlier would
          # swallow the `noloss` and `imp` receipts before their own guards
          # saw them and silently make those two untestable (BLO-33636: an
          # inert guard already shipped here once for exactly this reason).
          THRESH=0.002
          mean=$(jq -s --arg s "$SOURCE" --arg g "$GROUP" --argjson n "$N" --argjson t "$THRESH" '
            if (length == $n)
               and all(.[]; .source == $s and .group == $g
                            and (.packet_count // 0) > 0
                            and (.mmtp.implausible // 1) == 0
                            and ((.mmtp.loss_ratio | type) == "number")
                            and ((.mmtp.in_sequence | type) == "number")
                            and ((.mmtp.tracks | type) == "number")
                            and (.mmtp.tracks <= .mmtp.received)
                            and (.mmtp.in_sequence >= (((.packet_count // 0) - (.mmtp.tracks // 0)) * 0.9)))
            then if all(.[]; ((.mmtp.received + 1) * $t) > 1)
                 then (map(.mmtp.loss_ratio) | add / length)
                 else "short" end
            else null end' leg$LEG-report-*.json 2>/dev/null) || mean=null
          [ -n "$mean" ] || mean=null
          echo "leg${LEG}_n=$N leg${LEG}_mean_loss=$mean"

          # WITHIN-VANTAGE SPREAD, and it is the control this design was
          # missing. A leg with N > 1 runs N tunnels from ONE address at one
          # instant, so the disagreement AMONG them is what two observers
          # sharing a vantage see -- which is the term the cross-vantage floor
          # assumes is the whole story. Pairing it with the cross-vantage noise
          # floor is what makes "the dominant loss is upstream of the vantage"
          # falsifiable in EVERY run instead of resting on the single
          # favourable observation that licensed the design.
          #
          # REPORTED, NOT GATED, and deliberately so: turning it into a VOID arm
          # needs a constant, and the ruling that commissioned this design says
          # a constant comes from data rather than from whoever is writing the
          # instrument. This emits the data. Null for the N=1 legs, which have
          # nothing to disagree with. Computed in its own jq so the heavily
          # mutation-tested mean above is left untouched -- but with the SAME
          # `length == $n` count guard, for the same reason: jq -s slurps an
          # empty receipt (a container that died before writing) as zero
          # values without erroring, so a partly-failed leg would otherwise
          # publish a spread over the survivors under this leg's N.
          spread=$(jq -s --argjson n "$N" '[.[].mmtp.loss_ratio]
            | if (length == $n) and (length > 1) and (all(.[]; type == "number"))
              then (max - min) else null end' leg$LEG-report-*.json 2>/dev/null) || spread=null
          [ -n "$spread" ] || spread=null
          echo "leg${LEG}_within_vantage_spread=$spread"

          # --argjson mean so a null stays a JSON null and a float stays a
          # float; --arg ip because "unavailable" is a legal value here and the
          # verdict's distinctness guard must see it as a string, not choke.
          jq -n --argjson leg "$LEG" --argjson n "$N" --argjson mean "$mean" \
                --argjson spread "$spread" \
                --arg ip "$ip" --argjson start "$start" --argjson end "$end" \
            '{leg:$leg,n:$n,mean:$mean,spread:$spread,ip:$ip,start:$start,end:$end}' \
            | tee "leg-$LEG.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-loss-delta-leg-${{ matrix.leg }}
          path: |
            leg-${{ matrix.leg }}.json
            leg${{ matrix.leg }}-report-*.json
            leg${{ matrix.leg }}-verbose-*.log

  loss-delta-verdict:
    # `!cancelled()` and not `always()`: a cancelled workflow must not emit a
    # verdict of its own. Gated on preflight SUCCESS so a rejected dispatch
    # stays exit 92 from one job rather than arriving here as three absent
    # artifacts and being reported as VOID -- a claim about the path that
    # nothing about the path supports.
    #
    # needs['loss-delta-preflight'], NOT needs.loss-delta-preflight. A bare
    # property name in the expression grammar is [a-zA-Z_][a-zA-Z0-9_]*, so a
    # hyphenated job id read with dot syntax is parsed as SUBTRACTION rather
    # than as a lookup -- and the gate then evaluates to something that is not
    # the preflight result, silently, with no workflow error. The `needs:` LIST
    # below is unaffected; it is not an expression.
    if: ${{ !cancelled() && inputs.mode == 'loss-delta' && needs['loss-delta-preflight'].result == 'success' }}
    needs: [loss-delta-preflight, loss-delta]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `issues: write`: this mode is dispatch-only measurement and must never
    # file an outage row. Routing belongs to the scheduled oneshot probe.
    permissions:
      contents: read
    env:
      TIMEOUT: ${{ inputs.timeout || '30' }}
      TUNNELS: ${{ inputs.tunnels || '3' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amt-loss-delta-leg-*
          merge-multiple: true
      - name: fan-out loss delta verdict (concurrent cross-vantage)
        run: |
          # From the AC, NOT a dispatch input: a caller must not be able to
          # declare the threshold that decides their own result.
          THRESH=0.002

          # Assemble by LEG INDEX, not by filename order or arrival order. The
          # legs are concurrent and their artifacts land in whatever order the
          # uploads finished, so sorting is not cosmetic -- $m[1] must be the
          # treatment leg or the signal is computed from a floor.
          ls -1 leg-*.json 2>/dev/null || true
          legs=$(jq -sc 'sort_by(.leg)' leg-*.json 2>/dev/null) || legs='[]'
          [ -n "$legs" ] || legs='[]'
          echo "legs=$legs"

          # One jq for everything the shell cannot do: float comparison, set
          # arithmetic on the vantages, and the window intersection. Emits
          # TAB-separated verdict/signal/noise/why so the shell never parses a
          # float. The guard ORDER below is the ruling's: a structurally
          # invalid run is not scored, it is refused.
          verdict=$(jq -rn --argjson l "$legs" --argjson t "$THRESH" --argjson tmo "${TIMEOUT:-0}" '
            ($l | map(.mean))                                   as $m
          | ($l | map(.ip))                                     as $ips
          | ($l | map(.leg))                                    as $idx
          # Joined OUTSIDE the message strings. jq string interpolation \(...)
          # carries raw jq, where a backslash-escaped quote is a syntax error --
          # so `join(", ")` cannot be written inline inside one.
          | ($ips | join(", "))                                 as $ipslist
          | ($ips | join("/"))                                  as $ipsslash
          | if ($l | length) != 3 or $idx != [1,2,3]
            then "VOID\tnull\tnull\tthe run did not produce three legs indexed 1,2,3 (got \($idx)): a leg job was cancelled, never started, or failed before writing its artifact. That is a missing measurement, not a relay verdict."

            # SHAPE. The arithmetic below reads $m[0]/$m[1]/$m[2] positionally
            # as floor/treatment/floor, and every artifact carries the N it ran
            # at -- so check it here rather than trusting the matrix. A future
            # matrix edit then fails at runtime, not only in the test file.
            elif ($l[0].n == 1 and $l[2].n == 1 and $l[1].n >= 2) | not
            then "VOID\tnull\tnull\tthe legs are not floor/treatment/floor (n = \($l | map(.n))): legs 1 and 3 must run N=1 and leg 2 N>=2, or the signal is computed against the wrong term. That is a matrix edit, not a relay verdict."

            # DISTINCTNESS IS CHECKED BEFORE THE MEANS, and that order is the
            # design. Two legs on one address are the collision under test, so
            # any number they produce is a measurement of the defect wearing
            # the floor-pair label -- scoring it first would be the withdrawn
            # bracket rebuilt silently. `unavailable` counts as a collision
            # too: an unknown vantage cannot be shown distinct, and the guard
            # fails closed.
            elif ($ips | unique | length) != 3 or ($ips | any(. == "unavailable"))
            then "VOID\tnull\tnull\tthe three legs did not draw three distinct, known egress addresses (\($ipslist)). Two legs sharing one address ARE the collision this AC measures, so they cannot be a control pair; an unreadable address cannot be shown distinct and fails closed. Re-dispatch: GitHub does not promise a distinct egress per runner."

            # OVERLAP. max(starts) .. min(ends) is the interval all three legs
            # were joined at once. Empty means they ran in sequence, which is
            # the withdrawn design wearing this design label.
            #
            # NO APOSTROPHES ANYWHERE IN THIS JQ PROGRAM. It is a shell
            # single-quoted string, so one closes the quote and bash then
            # parses the remainder of the program as commands -- which fails
            # with `syntax error near unexpected token else`, naming a line
            # nowhere near the apostrophe. Cost an hour once; the test below
            # asserts it so the next one costs nothing.
            else ([$l[].start] | max) as $s0
               | ([$l[].end]   | min) as $e0
               | (($e0 - $s0) | if . < 0 then 0 else . end) as $ov
               | (if $tmo > 0 then $ov / $tmo else null end)  as $ovf
               | if $ov <= 0
                 then "VOID\tnull\tnull\tthe three legs never ran at the same time (three-way overlap \($ov)s): a floor that did not run WHILE the signal ran is not a floor. Concurrency is what this design buys and it was not obtained -- check for a queued or delayed matrix leg."
                 elif ($m | any(. == null))
                 then "VOID\tnull\tnull\tat least one leg produced no usable mean (the per-receipt lines in that leg job name the field; in_sequence is judged against 0.9 x (packet_count - tracks)) [overlap \($ov)s, \($ovf) of timeout]"
                 elif ($m | any(. == "short"))
                 then "VOID\tnull\tnull\tsample too short to resolve the threshold: every receipt must have (received + 1) > 1/THRESH = \(1 / $t), so that ONE lost packet reads below THRESH, and at least one did not. late (behind-the-mark) arrivals count in packet_count but not in received, so under reordering received falls well short of it (46328 of 67248 on the BLO-33636 receipt): dispatch with packet_count comfortably above \(1 / $t), not at it [overlap \($ov)s, \($ovf) of timeout]"
                 else
                   $m[0] as $a | $m[1] as $b | $m[2] as $c
                   | (($a + $c) / 2)                          as $base
                   | ($b - $base)                             as $signal
                   | (($a - $c) | if . < 0 then -. else . end) as $noise
                   | (" [overlap \($ov)s, \($ovf) of timeout; vantages \($ipsslash)]") as $ctx
                   | if   $noise  >= $t then "VOID\t\($signal)\t\($noise)\tnoise floor >= threshold\($ctx)"
                     elif $signal >= $t then "FAIL\t\($signal)\t\($noise)\tfan-out cost >= threshold\($ctx)"
                     else                    "PASS\t\($signal)\t\($noise)\tfan-out cost < threshold\($ctx)" end
                 end
            end') || verdict=$(printf 'VOID\tnull\tnull\tverdict arithmetic failed')
          v=$(printf '%s' "$verdict" | cut -f1)
          signal=$(printf '%s' "$verdict" | cut -f2)
          noise=$(printf '%s' "$verdict" | cut -f3)
          why=$(printf '%s' "$verdict" | cut -f4)

          # The floor DISTRIBUTION, emitted on every run regardless of verdict.
          # The ruling's condition 4: no PASS is credited until the floor has
          # been characterized over >= 5 runs, and >2e-4 on any single read is a
          # stop-and-re-examine rather than a licence to widen THRESH. That is
          # a claim about a population, so the per-run reading has to be
          # harvestable from the log by a reader who has not read this comment.
          vantage=$(jq -rn --argjson l "$legs" '[$l[].ip] | join("/")' 2>/dev/null || echo unknown)
          echo "vantage_addresses=$vantage"
          echo "floor_legs=$(jq -rn --argjson l "$legs" '[$l[] | select(.n == 1) | .mean | tostring] | join(",")' 2>/dev/null || echo unknown)"
          # The paired control. `noise` is what two observers on DIFFERENT
          # vantages disagreed by; this is what N observers on ONE vantage
          # disagreed by, at the same instant, against the same relay and
          # stream. The cross-vantage floor is only a floor if the two are
          # comparable -- if within-vantage agreement is orders of magnitude
          # tighter, the floor is measuring the vantages rather than the path,
          # and a wide floor is a property of the DESIGN rather than of the
          # night. Reported so that question is answerable from any run.
          within=$(jq -rn --argjson l "$legs" '[$l[] | select(.n > 1) | .spread | tostring] | join(",")' 2>/dev/null || echo unknown)
          echo "within_vantage_spread=$within"
          echo "fanout_loss_signal=$signal fanout_loss_noise_floor=$noise threshold=$THRESH verdict=$v"

          case "$v" in
            PASS)
              echo "PASS: fan-out to N=$TUNNELS cost $signal loss over the mean of its two concurrent N=1 floor legs, against a noise floor of $noise and a threshold of $THRESH. $why"
              echo "NOT YET A CREDITED PASS on its own: per the 2026-09-30 ruling (condition 4), the floor distribution must be published from >= 5 runs before any PASS counts, and a floor read above 2e-4 is a signal to re-examine this design rather than to widen the threshold. This run contributes ONE reading: noise_floor=$noise."
              ;;
            # VOID is checked FIRST on purpose. When the floor is wide the
            # signal is uninterpretable in EITHER direction -- a small delta
            # over a drifting baseline is not evidence of a cheap fan-out, it
            # is evidence that this run could not ask the question. Scoring it
            # PASS would be the retired clause's defect with the sign flipped.
            VOID)
              echo "::error::VOID, not FAIL: $why (signal=$signal noise_floor=$noise threshold=$THRESH re-examine_above=2e-4 within_vantage_spread=$within, vantages=$vantage). This run cannot answer whether fan-out costs loss, and that is NOT a relay verdict -- do not read it as one. If the floor is what voided it (noise_floor >= threshold), that floor is at least 10x the 2e-4 single read that condition 4 treats as a signal to re-examine this design rather than to widen the threshold, and this run does not say whether the upstream path drifted or the cross-vantage floor is measuring the vantages: within_vantage_spread beside it is the reading that separates the two. A leg that failed to ESTABLISH fan-out is oneshot's verdict (exit 91/93), not this job's."
              exit 91
              ;;
            FAIL)
              echo "::error::FAIL: fan-out to N=$TUNNELS cost $signal loss over its two concurrent N=1 floor legs (noise floor $noise, threshold $THRESH). The floor is BELOW the threshold, so the paths were stable enough to ask and the cost is attributable to serving N tunnels rather than 1."
              exit 1
              ;;
            *)
              echo "::error::unreachable verdict '$v' -- the jq above emits only PASS/FAIL/VOID, so this means its output shape changed"; exit 92
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-loss-delta-verdict
          path: leg-*.json
